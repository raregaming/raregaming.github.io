<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RG ESPORTS x RARE GAMING</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background: #08080c;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(255, 70, 85, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 230, 255, 0.1), transparent 40%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      background: rgba(18, 20, 29, 0.85);
      border: 1px solid rgba(255, 70, 85, 0.4);
      box-shadow: 0 0 35px rgba(255, 70, 85, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 15px;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(20px, 5vw, 32px);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 70, 85, 0.6);
    }

    .header h1 span {
      color: #ff4655;
    }

    .header p {
      color: #00e6ff;
      font-size: 14px;
      letter-spacing: 3px;
      margin-top: 5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Titles */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      color: #ff4655;
      font-size: 14px;
      letter-spacing: 1.5px;
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,70,85,0.5), transparent);
    }

    /* Form Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .player-card {
      background: rgba(10, 11, 16, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid #00e6ff;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .player-card.sub {
      border-left-color: #888;
    }

    .player-card label {
      display: block;
      font-size: 12px;
      color: #8a93a0;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Custom Inputs */
    input {
      width: 100%;
      background: #0c0d14;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 10px 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: #4a5260;
    }

    input:focus {
      border-color: #ff4655;
      box-shadow: 0 0 10px rgba(255, 70, 85, 0.3);
      background: #121420;
    }

    /* Register Button */
    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #ff4655, #c02633);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 70, 85, 0.4);
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 70, 85, 0.7);
      background: linear-gradient(135deg, #ff5c6a, #d42b39);
    }

    /* SUCCESS BOX STYLING */
    #successBox {
      display: none; /* Default Hidden */
      text-align: center;
      padding: 30px 15px;
    }

    .success-icon {
      font-size: 50px;
      color: #25D366;
      margin-bottom: 15px;
    }

    .success-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      color: #00e6ff;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .success-msg {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .whatsapp-btn {
      display: inline-block;
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 18px;
      text-decoration: none;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .whatsapp-btn:hover {
      background: #20bd5a;
      box-shadow: 0 0 30px rgba(37, 211, 102, 0.7);
      transform: translateY(-2px);
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .wrapper {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <h1>RG ESPORTS <span>x</span> RARE GAMING</h1>
      <p>TOURNAMENT REGISTRATION</p>
    </div>

    <!-- REGISTRATION FORM -->
    <form id="tournamentForm">
      
      <!-- TEAM INFO -->
      <div class="section-title">01. TEAM DETAILS</div>
      <div style="margin-bottom: 12px;">
        <input type="text" id="teamName" placeholder="ENTER TEAM NAME" required>
      </div>
      <div class="grid-2">
        <input type="text" id="captainName" placeholder="CAPTAIN NAME" required>
        <input type="tel" id="whatsappNo" placeholder="WHATSAPP NUMBER" required>
      </div>

      <!-- PLAYERS INFO -->
      <div class="section-title">02. SQUAD ROSTER</div>

      <!-- Player 1 -->
      <div class="player-card">
        <label>PLAYER 1 (CAPTAIN)</label>
        <div class="grid-2">
          <input type="text" id="p1Name" placeholder="Player Name" required>
          <input type="text" id="p1UID" placeholder="In-Game UID" required>
        </div>
      </div>

      <!-- Player 2 -->
      <div class="player-card">
        <label>PLAYER 2</label>
        <div class="grid-2">
          <input type="text" id="p2Name" placeholder="Player Name" required>
          <input type="text" id="p2UID" placeholder="In-Game UID" required>
        </div>
      </div>

      <!-- Player 3 -->
      <div class="player-card">
        <label>PLAYER 3</label>
        <div class="grid-2">
          <input type="text" id="p3Name" placeholder="Player Name" required>
          <input type="text" id="p3UID" placeholder="In-Game UID" required>
        </div>
      </div>

      <!-- Player 4 -->
      <div class="player-card">
        <label>PLAYER 4</label>
        <div class="grid-2">
          <input type="text" id="p4Name" placeholder="Player Name" required>
          <input type="text" id="p4UID" placeholder="In-Game UID" required>
        </div>
      </div>

      <!-- Sub Player -->
      <div class="player-card sub">
        <label style="color:#888;">SUBSTITUTE PLAYER (OPTIONAL)</label>
        <div class="grid-2">
          <input type="text" id="subName" placeholder="Sub Name">
          <input type="text" id="subUID" placeholder="Sub UID">
        </div>
      </div>

      <!-- LOGO UPLOAD SECTION -->
      <div class="player-card" style="border-left-color: #ff4655;">
        <label style="color: #ff4655;">UPLOAD TEAM LOGO (PNG/JPG)</label>
        <div style="margin-top: 8px;">
          <input type="file" id="teamLogo" accept="image/*" style="padding: 8px; cursor: pointer;">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">REGISTER NOW</button>
    </form>

    <!-- SUCCESS MESSAGE & WHATSAPP JOIN CARD -->
    <div id="successBox">
      <div class="success-icon">✔</div>
      <div class="success-title">REGISTRATION SUCCESSFUL!</div>
      <p class="success-msg">आपकी टीम का रजिस्ट्रेशन सफलतापूर्वक हो गया है। आगे के अपडेट्स और मैच शेड्यूल के लिए नीचे दिए गए बटन पर क्लिक करके Official WhatsApp Community जॉइन करें!</p>
      
      <!-- YOUR WHATSAPP LINK HERE -->
      <a href="https://chat.whatsapp.com/HNJr2Jidm1b4YGHyhCRKyr" target="_blank" class="whatsapp-btn">
        💬 JOIN WHATSAPP COMMUNITY
      </a>
    </div>

  </div>

  <script>
    // Form Handle Functionality
    document.getElementById("tournamentForm").addEventListener("submit", function(e) {
      e.preventDefault(); // Page refresh hone se rokne ke liye

      // Form hide karo aur Success Screen dikhao
      document.getElementById("tournamentForm").style.display = "none";
      document.getElementById("successBox").style.display = "block";
    });
  </script>

</body>
</html>

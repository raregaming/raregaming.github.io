<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Battle Royale (Free Fire Style)</title>
  <!-- Three.js 3D Engine & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* Crosshair (निशाना) */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.85);
    }
    #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
    #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }

    /* Top Lobby UI */
    #ui {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
      background: rgba(15, 15, 20, 0.8); padding: 10px 18px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
    }
    input, button { padding: 8px 14px; font-size: 14px; border: none; border-radius: 4px; font-weight: bold; }
    input { background: #222; color: #fff; border: 1px solid #444; width: 130px; }
    button { background: #ff4757; color: #fff; cursor: pointer; transition: 0.2s; }
    button:hover { background: #ff6b81; }

    /* Battle HUD */
    #hud {
      position: absolute; bottom: 25px; left: 25px; z-index: 10;
      pointer-events: none; display: flex; flex-direction: column; gap: 8px;
    }
    .hud-card {
      background: rgba(0, 0, 0, 0.65); padding: 10px 16px; border-radius: 6px;
      color: #fff; font-size: 15px; border-left: 4px solid #2ed573;
    }
    #zoneAlert {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      color: #ff4757; font-size: 18px; font-weight: bold; z-index: 10; text-shadow: 0 0 8px #000;
    }
    #blocker {
      position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 4; cursor: pointer;
    }
    #instructions { color: white; font-size: 20px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  <div id="zoneAlert"></div>

  <div id="ui">
    <button id="hostBtn">Create Room (Host)</button>
    <input type="text" id="roomIdInput" placeholder="Enter Room UID">
    <button id="joinBtn">Join Match</button>
    <span id="status" style="color: #7bed9f; align-self: center; font-size: 14px; font-weight: bold;">Lobby Ready</span>
  </div>

  <div id="hud">
    <div class="hud-card">
      <div>HP: <span id="hpVal" style="color:#2ed573; font-weight: bold;">100</span> / 100</div>
      <div>Gun: <span id="gunVal" style="color:#ffa502;">3D AR Rifle</span></div>
      <div>Alive: <span id="aliveVal">1</span></div>
    </div>
  </div>

  <div id="blocker">
    <div id="instructions">
      स्क्रीन पर क्लिक करें (Click to Play & Lock Aim)<br>
      <span style="font-size: 14px; color: #ced6e0;">[W, A, S, D] Move | [Mouse] Look Around | [Left Click] Shoot | [Space] Jump</span>
    </div>
  </div>

  <script>
    // --- 1. THREE.JS 3D SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x74b9ff); // Sky
    scene.fog = new THREE.FogExp2(0x74b9ff, 0.008);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 150, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3D Ground (Map)
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2ed573 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 3D Buildings / Obstacles
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    for (let i = 0; i < 40; i++) {
      const h = 8 + Math.random() * 15;
      const w = 8 + Math.random() * 8;
      const boxMat = new THREE.MeshLambertMaterial({ color: 0x747d8c });
      const building = new THREE.Mesh(boxGeo, boxMat);
      building.scale.set(w, h, w);
      building.position.set((Math.random() - 0.5) * 600, h / 2, (Math.random() - 0.5) * 600);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);
    }

    // Safe Zone (3D Cylinder)
    let zoneRadius = 400;
    const zoneGeo = new THREE.CylinderGeometry(zoneRadius, zoneRadius, 80, 32, 1, true);
    const zoneMat = new THREE.MeshBasicMaterial({ color: 0x0984e3, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
    const zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
    zoneMesh.position.set(0, 40, 0);
    scene.add(zoneMesh);

    // --- 2. PLAYER & FPS CONTROLS ---
    const myId = Math.random().toString(36).substring(2, 7);
    const myPlayer = {
      id: myId,
      hp: 100,
      x: (Math.random() - 0.5) * 200,
      y: 3,
      z: (Math.random() - 0.5) * 200,
      rotY: 0
    };
    camera.position.set(myPlayer.x, myPlayer.y, myPlayer.z);

    const keys = {};
    let isLocked = false;
    const blocker = document.getElementById('blocker');

    blocker.addEventListener('click', () => document.body.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      blocker.style.display = isLocked ? 'none' : 'flex';
    });

    let pitch = 0, yaw = 0;
    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
      camera.rotation.set(0, 0, 0);
      camera.rotateY(yaw);
      camera.rotateX(pitch);
    });

    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- 3. MULTIPLAYER & NETWORKING (PeerJS) ---
    let peer = null, connections = [], isHost = false;
    const remotePlayers = {}; // id -> 3D Mesh
    const bullets = [];

    function createPlayerMesh(color = 0xff4757) {
      const group = new THREE.Group();
      // Body
      const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 4, 16), new THREE.MeshLambertMaterial({ color }));
      body.position.y = 2;
      group.add(body);
      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshLambertMaterial({ color: 0xffd32a }));
      head.position.y = 4.5;
      group.add(head);
      // 3D Gun
      const gun = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 3), new THREE.MeshLambertMaterial({ color: 0x2f3542 }));
      gun.position.set(1.2, 2.5, -1.5);
      group.add(gun);
      scene.add(group);
      return group;
    }

    // Host Room
    document.getElementById('hostBtn').onclick = () => {
      const uid = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('ff3d-' + uid);
      peer.on('open', () => {
        isHost = true;
        document.getElementById('status').innerText = `Room UID: ${uid}`;
        document.getElementById('hostBtn').disabled = true;
        document.getElementById('joinBtn').disabled = true;
      });
      peer.on('connection', conn => {
        connections.push(conn);
        conn.on('data', data => handleNetworkData(data));
      });
    };

    // Join Room
    document.getElementById('joinBtn').onclick = () => {
      const uid = document.getElementById('roomIdInput').value.trim();
      if (!uid) return;
      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect('ff3d-' + uid);
        connections.push(conn);
        conn.on('open', () => {
          document.getElementById('status').innerText = `Joined UID: ${uid}`;
          document.getElementById('hostBtn').disabled = true;
          document.getElementById('joinBtn').disabled = true;
        });
        conn.on('data', data => handleNetworkData(data));
      });
    };

    function broadcast(data) {
      connections.forEach(c => { if (c.open) c.send(data); });
    }

    function handleNetworkData(data) {
      if (data.type === 'pos') {
        if (!remotePlayers[data.id]) {
          remotePlayers[data.id] = createPlayerMesh();
          document.getElementById('aliveVal').innerText = Object.keys(remotePlayers).length + 1;
        }
        const rp = remotePlayers[data.id];
        rp.position.set(data.x, data.y - 3, data.z);
        rp.rotation.y = data.rotY;
        if (isHost) broadcast(data);
      } else if (data.type === 'shoot') {
        spawnBullet(data.x, data.y, data.z, data.dir, data.owner);
        if (isHost) broadcast(data);
      }
    }

    // --- 4. SHOOTING & BULLETS ---
    function spawnBullet(x, y, z, dir, owner) {
      const bGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const bMat = new THREE.MeshBasicMaterial({ color: 0xffa502 });
      const bullet = new THREE.Mesh(bGeo, bMat);
      bullet.position.set(x, y, z);
      scene.add(bullet);
      bullets.push({ mesh: bullet, dir: dir, owner: owner, life: 100 });
    }

    window.addEventListener('mousedown', (e) => {
      if (!isLocked || myPlayer.hp <= 0 || e.button !== 0) return;
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      
      const origin = camera.position.clone().add(dir.clone().multiplyScalar(1.5));
      spawnBullet(origin.x, origin.y, origin.z, dir, myId);
      
      broadcast({
        type: 'shoot',
        x: origin.x, y: origin.y, z: origin.z,
        dir: { x: dir.x, y: dir.y, z: dir.z },
        owner: myId
      });
    });

    // --- 5. MAIN GAME LOOP ---
    const clock = new THREE.Clock();
    let velocityY = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isLocked && myPlayer.hp > 0) {
        // WASD Movement (Horizontal Widescreen perspective)
        const moveSpeed = 45 * delta;
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

        if (keys['KeyW']) camera.position.add(forward.clone().multiplyScalar(moveSpeed));
        if (keys['KeyS']) camera.position.add(forward.clone().multiplyScalar(-moveSpeed));
        if (keys['KeyA']) camera.position.add(right.clone().multiplyScalar(-moveSpeed));
        if (keys['KeyD']) camera.position.add(right.clone().multiplyScalar(moveSpeed));

        // Jump & Gravity
        if (keys['Space'] && camera.position.y <= 3.1) velocityY = 12;
        velocityY -= 30 * delta;
        camera.position.y += velocityY * delta;
        if (camera.position.y < 3) {
          camera.position.y = 3;
          velocityY = 0;
        }

        // Safe Zone Logic
        const distFromCenter = Math.hypot(camera.position.x, camera.position.z);
        if (distFromCenter > zoneRadius) {
          myPlayer.hp -= 8 * delta;
          document.getElementById('zoneAlert').innerText = "⚠️ DANGER: You are Outside the Safe Zone!";
        } else {
          document.getElementById('zoneAlert').innerText = "";
        }

        document.getElementById('hpVal').innerText = Math.max(0, Math.floor(myPlayer.hp));

        // Broadcast Position
        broadcast({
          type: 'pos',
          id: myId,
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z,
          rotY: yaw
        });
      }

      // Zone Shrink
      if (zoneRadius > 50) {
        zoneRadius -= 1.5 * delta;
        zoneMesh.scale.set(zoneRadius / 400, 1, zoneRadius / 400);
      }

      // Bullets Update & Hitbox
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.mesh.position.x += b.dir.x * 120 * delta;
        b.mesh.position.y += b.dir.y * 120 * delta;
        b.mesh.position.z += b.dir.z * 120 * delta;
        b.life--;

        // Check if hits me
        if (b.owner !== myId && myPlayer.hp > 0) {
          const hitDist = camera.position.distanceTo(b.mesh.position);
          if (hitDist < 2.5) {
            myPlayer.hp -= 25;
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            continue;
          }
        }

        if (b.life <= 0) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>

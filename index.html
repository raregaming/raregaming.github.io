<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Royale - 3D Skin Lobby</title>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: radial-gradient(circle at center, #2e1503 0%, #080402 100%);
      color: #fff; display: flex; flex-direction: column; justify-content: space-between;
      position: relative;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }

    /* 1. TOP HEADER */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px; z-index: 10;
    }
    .profile-card {
      display: flex; align-items: center; gap: 12px;
      background: rgba(15, 15, 20, 0.75); padding: 6px 14px; border-radius: 6px;
      border: 1px solid rgba(243, 156, 18, 0.4); backdrop-filter: blur(8px);
    }
    .avatar-icon {
      width: 44px; height: 44px; border-radius: 4px; border: 2px solid #e67e22;
      background: #111; object-fit: cover;
    }
    .profile-info { display: flex; flex-direction: column; }
    .name-wrapper { display: flex; align-items: center; gap: 6px; }
    .profile-name {
      font-size: 15px; font-weight: 900; color: #f1c40f; letter-spacing: 0.5px;
      background: transparent; border: none; outline: none; width: 130px;
    }
    .profile-uid { font-size: 11px; color: #aaa; }

    .currencies {
      display: flex; gap: 18px; background: rgba(15, 15, 20, 0.75); padding: 7px 18px;
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    }
    .curr-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; }
    .gold { color: #f39c12; }
    .diamond { color: #00d2d3; }

    .top-actions { display: flex; gap: 10px; }
    .btn-action {
      background: linear-gradient(180deg, #e67e22, #d35400); color: #fff;
      border: 1px solid #f39c12; padding: 8px 16px; font-size: 12px; font-weight: bold;
      border-radius: 4px; cursor: pointer; text-transform: uppercase;
    }
    .btn-action:hover { filter: brightness(1.2); }

    /* 2. LEFT SIDE QUICK MENU */
    .left-menu {
      position: absolute; left: 25px; top: 110px;
      display: flex; flex-direction: column; gap: 14px; z-index: 10;
    }
    .menu-btn {
      width: 52px; height: 52px; background: rgba(15, 15, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; font-size: 10px; font-weight: bold; color: #eee;
    }
    .menu-btn:hover { border-color: #f1c40f; background: rgba(243, 156, 18, 0.2); transform: scale(1.06); }

    /* 3. CENTER HUD */
    .center-hud {
      position: absolute; bottom: 130px; left: 50%;
      transform: translateX(-50%); z-index: 10; pointer-events: none;
    }
    .char-nameplate {
      background: rgba(10, 10, 12, 0.85); padding: 6px 24px;
      border-radius: 4px; border: 1px solid #f39c12; font-size: 14px; font-weight: 900;
      color: #f1c40f; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
    }

    /* 4. BOTTOM BAR & START */
    .bottom-bar {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 20px 30px; z-index: 10;
    }
    .bottom-slots {
      display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 6px;
    }
    .slot-item {
      width: 44px; height: 44px; background: #1a1a1a; border: 1px solid #444;
      border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    .match-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .mode-badge {
      background: rgba(15, 15, 20, 0.9); border: 2px solid #f39c12; border-radius: 6px;
      padding: 8px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .mode-title { font-size: 14px; font-weight: 900; color: #fff; text-transform: uppercase; }
    .mode-sub { font-size: 11px; color: #f1c40f; }

    .start-btn {
      background: linear-gradient(180deg, #ffbe1a 0%, #e67e22 100%);
      border: 2px solid #fff; border-radius: 8px;
      color: #000; font-size: 28px; font-weight: 900; font-style: italic;
      padding: 12px 70px; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 25px rgba(243, 156, 18, 0.6); transition: 0.15s;
    }
    .start-btn:hover { transform: scale(1.05); filter: brightness(1.15); }

    /* 5. MODALS */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px);
    }
    .modal-box {
      background: #14171f; width: 620px; max-width: 90vw; border-radius: 10px; padding: 22px;
      border: 1px solid #f39c12; box-shadow: 0 0 35px rgba(0,0,0,0.9);
    }
    .modal-title { font-size: 18px; font-weight: 900; color: #f1c40f; margin-bottom: 12px; text-transform: uppercase; }
    
    .upload-skin-box {
      background: #1e222d; border: 2px dashed #f39c12; border-radius: 8px;
      padding: 14px; text-align: center; margin-bottom: 15px; cursor: pointer;
    }
    .upload-skin-box:hover { background: #262c3a; }
    .upload-skin-box p { font-size: 13px; font-weight: bold; color: #f1c40f; margin-bottom: 4px; }
    .upload-skin-box span { font-size: 11px; color: #aaa; }

    .char-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      max-height: 240px; overflow-y: auto; margin-bottom: 15px; padding-right: 4px;
    }
    .char-card {
      background: #1e222d; border: 2px solid transparent; border-radius: 6px;
      padding: 8px; cursor: pointer; text-align: center; transition: 0.2s;
    }
    .char-card.active, .char-card:hover { border-color: #f39c12; background: #2b303f; transform: translateY(-2px); }
    .char-card img { width: 100%; height: 95px; object-fit: cover; border-radius: 4px; margin-bottom: 6px; background: #111; }
    .char-card p { font-size: 12px; font-weight: 900; color: #ddd; }
    .char-card span { font-size: 10px; color: #f39c12; }

    .room-opt-btn {
      width: 100%; padding: 12px; background: #2c3e50; color: #fff;
      border: 1px solid #475a6f; border-radius: 6px; margin-bottom: 10px;
      font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .room-opt-btn:hover { background: #e67e22; border-color: #f39c12; }
    .close-btn { background: #c0392b; width: 100%; padding: 10px; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- 1. Top Header -->
  <div class="top-bar">
    <div class="profile-card">
      <img id="profileAvatar" class="avatar-icon" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="Avatar">
      <div class="profile-info">
        <div class="name-wrapper">
          <input type="text" id="usernameInput" class="profile-name" value="PLAYER_ONE" maxlength="14" onchange="saveUsername()">
          <span style="font-size:12px; cursor:pointer;" onclick="document.getElementById('usernameInput').focus()">✏️</span>
        </div>
        <span class="profile-uid">UID: <b id="displayUid">000000</b></span>
      </div>
    </div>

    <!-- Currencies -->
    <div class="currencies">
      <div class="curr-item gold">🪙 <span>0</span></div>
      <div class="curr-item diamond">💎 <span>0</span></div>
    </div>

    <div class="top-actions">
      <button class="btn-action" onclick="openModal('roomModal')">Create Room</button>
      <button class="btn-action" style="background: #2980b9; border-color:#3498db;" onclick="openModal('joinModal')">Join Room</button>
    </div>
  </div>

  <!-- 2. Left Side Menu -->
  <div class="left-menu">
    <div class="menu-btn" onclick="openModal('charModal')">
      <span style="font-size: 18px;">👤</span>
      <span>HERO</span>
    </div>
    <div class="menu-btn">
      <span style="font-size: 18px;">🎒</span>
      <span>VAULT</span>
    </div>
    <div class="menu-btn">
      <span style="font-size: 18px;">🔫</span>
      <span>GUNS</span>
    </div>
  </div>

  <!-- 3. Center Info -->
  <div class="center-hud">
    <div class="char-nameplate">
      <span>👑</span>
      <span id="charNameDisplay">CYBER COMMANDO</span>
    </div>
  </div>

  <!-- 4. Bottom Controls -->
  <div class="bottom-bar">
    <div class="bottom-slots">
      <div class="slot-item">💣</div>
      <div class="slot-item">🛡️</div>
      <div class="slot-item">⚡</div>
    </div>

    <div class="match-controls">
      <div class="mode-badge" onclick="openModal('roomModal')">
        <span style="font-size: 22px;">🏆</span>
        <div>
          <div class="mode-title" id="selectedModeText">BR-RANKED (SOLO)</div>
          <div class="mode-sub">Map: Bermuda Arena</div>
        </div>
      </div>
      <button class="start-btn" id="startBtn" onclick="launchMatch()">START</button>
    </div>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- Skin Modal -->
  <div class="modal-overlay" id="charModal">
    <div class="modal-box">
      <div class="modal-title">Select or Upload 3D Skin</div>
      <div class="upload-skin-box" onclick="document.getElementById('skinFileInput').click()">
        <p>📁 Upload Custom Character Image / PNG</p>
        <span>सिस्टम इसे 3D Minecraft स्टाइल कैरेक्टर में बदल देगा</span>
        <input type="file" id="skinFileInput" accept="image/*" style="display: none;" onchange="handleSkinUpload(event)">
      </div>
      <div class="char-grid" id="charactersContainer"></div>
      <button class="close-btn" onclick="closeModals()">EQUIP & CLOSE</button>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="roomModal">
    <div class="modal-box" style="width: 400px;">
      <div class="modal-title">Create Custom Room</div>
      <button class="room-opt-btn" onclick="setMode('SOLO (1v1)')">SOLO (1v1 Custom Room)</button>
      <button class="room-opt-btn" onclick="setMode('DUO (2v2)')">DUO (2v2 Team Match)</button>
      <button class="room-opt-btn" onclick="setMode('SQUAD (4v4)')">SQUAD (4v4 Classic)</button>
      <button class="close-btn" onclick="closeModals()">CANCEL</button>
    </div>
  </div>

  <!-- Join Room Modal -->
  <div class="modal-overlay" id="joinModal">
    <div class="modal-box" style="width: 400px;">
      <div class="modal-title">Enter Room UID</div>
      <input type="text" id="joinUidInput" placeholder="Enter Room UID" style="width:100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #f39c12; color: #fff; font-size: 16px; border-radius: 4px;">
      <button class="room-opt-btn" style="background:#27ae60;" onclick="joinMatchWithCode()">JOIN MATCH</button>
      <button class="close-btn" onclick="closeModals()">BACK</button>
    </div>
  </div>

  <script>
    const CHARACTERS_ROSTER = [
      { id: 1, name: "CYBER COMMANDO", role: "Assault", color: 0xff4757, img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300" },
      { id: 2, name: "SHADOW NINJA", role: "Stealth", color: 0x2ed573, img: "https://images.unsplash.com/photo-1563089145-599997674d42?w=300" },
      { id: 3, name: "TITAN HEAVY", role: "Tanker", color: 0xffa502, img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300" },
      { id: 4, name: "FROST AGENT", role: "Tactical", color: 0x70a1ff, img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300" },
      { id: 5, name: "TOXIC VIPER", role: "Scout", color: 0xa55eea, img: "https://images.unsplash.com/photo-1563089145-7945d8b84920?w=300" },
      { id: 6, name: "DESERT WARRIOR", role: "Sniper", color: 0xdfe4ea, img: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=300" }
    ];

    let equippedHero = CHARACTERS_ROSTER[0];
    let customTexture = null;

    // Three.js Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0c02, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 9.5);
    camera.lookAt(0, 2.0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const spotLight = new THREE.SpotLight(0xffbe1a, 2.5);
    spotLight.position.set(0, 10, 6);
    spotLight.castShadow = true;
    scene.add(spotLight);

    const rimLight = new THREE.PointLight(0x3742fa, 2.0, 15);
    rimLight.position.set(-4, 3, -3);
    scene.add(rimLight);

    // Platform
    const stageGeo = new THREE.CylinderGeometry(3, 3.2, 0.4, 32);
    const stageMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.3 });
    const stage = new THREE.Mesh(stageGeo, stageMat);
    stage.position.y = -0.2;
    stage.receiveShadow = true;
    scene.add(stage);

    const ringGeo = new THREE.RingGeometry(2.7, 2.9, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xf39c12, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    // 3D Model Group
    const char3DGroup = new THREE.Group();
    scene.add(char3DGroup);

    let headMesh, bodyMesh, leftArmMesh, rightArmMesh, leftLegMesh, rightLegMesh, gunMesh;

    function build3DCharacter(colorHex, texture = null) {
      while(char3DGroup.children.length > 0){ 
        char3DGroup.remove(char3DGroup.children[0]); 
      }

      const mat = texture 
        ? new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 }) 
        : new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });

      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8 });

      headMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), mat);
      headMesh.position.y = 3.6;
      headMesh.castShadow = true;
      char3DGroup.add(headMesh);

      bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.8), mat);
      bodyMesh.position.y = 2.1;
      bodyMesh.castShadow = true;
      char3DGroup.add(bodyMesh);

      leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.7, 0.5), mat);
      leftArmMesh.position.set(-1.05, 2.15, 0);
      leftArmMesh.castShadow = true;
      char3DGroup.add(leftArmMesh);

      rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.7, 0.5), mat);
      rightArmMesh.position.set(1.05, 2.15, 0);
      rightArmMesh.rotation.x = -0.4;
      rightArmMesh.castShadow = true;
      char3DGroup.add(rightArmMesh);

      gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 1.8), darkMat);
      gunMesh.position.set(1.15, 2.0, 0.6);
      gunMesh.rotation.x = -0.4;
      char3DGroup.add(gunMesh);

      leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), darkMat);
      leftLegMesh.position.set(-0.4, 0.8, 0);
      leftLegMesh.castShadow = true;
      char3DGroup.add(leftLegMesh);

      rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), darkMat);
      rightLegMesh.position.set(0.4, 0.8, 0);
      rightLegMesh.castShadow = true;
      char3DGroup.add(rightLegMesh);
    }

    function handleSkinUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const textureLoader = new THREE.TextureLoader();
        customTexture = textureLoader.load(e.target.result, () => {
          customTexture.magFilter = THREE.NearestFilter;
          customTexture.minFilter = THREE.NearestFilter;
          build3DCharacter(0xffffff, customTexture);
          
          document.getElementById('charNameDisplay').innerText = "CUSTOM 3D HERO";
          document.getElementById('profileAvatar').src = e.target.result;
          closeModals();
        });
      };
      reader.readAsDataURL(file);
    }

    function initLobby() {
      const randomUid = localStorage.getItem('game_uid') || Math.floor(100000 + Math.random() * 900000);
      document.getElementById('displayUid').innerText = randomUid;

      const savedName = localStorage.getItem('game_username');
      if (savedName) document.getElementById('usernameInput').value = savedName;

      renderCharactersGrid();
      build3DCharacter(equippedHero.color);
    }

    function renderCharactersGrid() {
      const container = document.getElementById('charactersContainer');
      container.innerHTML = '';

      CHARACTERS_ROSTER.forEach(char => {
        const card = document.createElement('div');
        card.className = `char-card ${char.id === equippedHero.id ? 'active' : ''}`;
        card.onclick = () => selectCharacter(char.id);
        card.innerHTML = `
          <img src="${char.img}" alt="${char.name}">
          <p>${char.name}</p>
          <span>[${char.role}]</span>
        `;
        container.appendChild(card);
      });
    }

    function selectCharacter(id) {
      const selected = CHARACTERS_ROSTER.find(c => c.id === id);
      if (selected) {
        equippedHero = selected;
        customTexture = null;
        build3DCharacter(selected.color);
        document.getElementById('charNameDisplay').innerText = selected.name;
        document.getElementById('profileAvatar').src = selected.img;
        renderCharactersGrid();
      }
    }

    function saveUsername() {
      const name = document.getElementById('usernameInput').value.trim();
      localStorage.setItem('game_username', name);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function setMode(mode) {
      document.getElementById('selectedModeText').innerText = `BR: ${mode}`;
      closeModals();
      const customCode = Math.floor(1000 + Math.random() * 9000);
      alert(`Room Created!\nShare UID with squad: ${customCode}`);
    }

    function joinMatchWithCode() {
      const code = document.getElementById('joinUidInput').value.trim();
      if (!code) return alert('कृपया सही Room UID दर्ज करें!');
      alert(`Connecting to Room UID: ${code}...`);
      closeModals();
    }

    function launchMatch() {
      const username = document.getElementById('usernameInput').value;
      alert(`Match Starting!\nPlayer: ${username}\nSelected 3D Hero: ${equippedHero.name}`);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      char3DGroup.position.y = Math.sin(time * 2) * 0.04;
      char3DGroup.rotation.y = Math.sin(time * 0.5) * 0.2;

      if (leftArmMesh) leftArmMesh.rotation.x = Math.sin(time * 2) * 0.08;
      if (headMesh) headMesh.rotation.y = Math.sin(time * 1.2) * 0.1;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = () => {
      initLobby();
      animate();
    };
  </script>
</body>
</html>

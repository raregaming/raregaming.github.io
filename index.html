<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhatsApp Style Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:#d9dbd5;
}

/* =========================
   MAIN APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    background:#fff;
}


/* =========================
   LEFT USER PANEL
========================= */

.sidebar{
    width:360px;
    max-width:38%;
    height:100%;
    background:#fff;
    border-right:1px solid #d8dde0;
    display:flex;
    flex-direction:column;
}


/* Top bar */

.sidebar-header{
    height:72px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.sidebar-title{
    font-size:21px;
    font-weight:bold;
}

.header-icons{
    display:flex;
    gap:20px;
}

.icon{
    border:none;
    background:none;
    font-size:23px;
    cursor:pointer;
    color:#526168;
}


/* Search */

.search-container{
    padding:8px 12px;
    background:#fff;
}

.search-box{
    height:42px;
    background:#f0f2f5;
    border-radius:9px;

    display:flex;
    align-items:center;

    padding:0 13px;
    gap:10px;

    color:#667781;
}

.search-box input{
    border:none;
    outline:none;
    background:transparent;
    width:100%;
    font-size:15px;
}


/* =========================
   USERS
========================= */

.users{
    flex:1;
    overflow-y:auto;
}

.user{
    height:76px;

    display:flex;
    align-items:center;

    padding:8px 14px;

    cursor:pointer;

    border-bottom:1px solid #e9edef;

    transition:.15s;
}

.user:hover{
    background:#f5f6f6;
}

.user.active{
    background:#e9edef;
}


/* Avatar */

.avatar{
    width:54px;
    height:54px;

    border-radius:50%;

    background:linear-gradient(
        145deg,
        #dfe5e7,
        #b9c2c6
    );

    display:grid;
    place-items:center;

    color:#526168;

    font-size:17px;
    font-weight:bold;

    flex:none;
}


/* User information */

.user-info{
    flex:1;
    min-width:0;
    margin-left:13px;
}

.user-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.user-name{
    font-size:16px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-time{
    font-size:12px;
    color:#667781;
}

.preview{
    margin-top:5px;

    color:#667781;

    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    min-width:20px;
    height:20px;

    padding:0 6px;

    border-radius:12px;

    background:#00a884;

    color:white;

    font-size:11px;

    display:grid;
    place-items:center;
}


/* =========================
   CHAT AREA
========================= */

.chat{
    flex:1;

    display:flex;
    flex-direction:column;

    min-width:0;
}


/* Chat header */

.chat-header{
    height:72px;

    background:#f0f2f5;

    border-bottom:1px solid #d8dde0;

    display:flex;
    align-items:center;

    padding:8px 16px;
}


/* Back button */

.back-button{
    display:none;

    border:none;
    background:none;

    font-size:30px;

    margin-right:8px;

    cursor:pointer;

    color:#445;
}


/* Header avatar */

.header-avatar{
    width:50px;
    height:50px;

    border-radius:50%;

    background:#d3dadd;

    display:grid;
    place-items:center;

    color:#53636a;

    font-weight:bold;
}


/* Header information */

.header-info{
    margin-left:12px;

    flex:1;

    min-width:0;
}

.header-name{
    font-size:17px;
    font-weight:600;
}

.header-status{
    font-size:12px;

    color:#667781;

    margin-top:4px;
}


/* Header buttons */

.header-buttons{
    display:flex;

    gap:22px;

    align-items:center;
}

.header-buttons button{
    border:none;

    background:none;

    font-size:22px;

    cursor:pointer;

    color:#46545b;
}


/* =========================
   CHAT MESSAGES
========================= */

.messages{
    flex:1;

    overflow-y:auto;

    padding:22px 7%;

    background-color:#efeae2;

    background-image:
        radial-gradient(
            rgba(90,90,90,.10) 1px,
            transparent 1px
        );

    background-size:18px 18px;
}


/* Date */

.date{
    width:max-content;

    margin:4px auto 18px;

    background:#fff3c4;

    color:#546067;

    padding:7px 12px;

    border-radius:7px;

    font-size:12px;

    box-shadow:0 1px 2px #0001;
}


/* Security */

.security{
    width:max-content;

    margin:15px auto;

    background:#fff3c4;

    color:#546067;

    padding:7px 13px;

    border-radius:7px;

    font-size:12px;

    box-shadow:0 1px 2px #0001;
}


/* Not connected */

.not-connected{
    width:max-content;

    margin:10px auto;

    background:#fff3c4;

    color:#546067;

    padding:7px 13px;

    border-radius:7px;

    font-size:12px;
}


/* Message bubble */

.message{
    max-width:min(70%,520px);

    padding:8px 10px 6px;

    margin:7px 0;

    border-radius:8px;

    font-size:14px;

    line-height:1.4;

    box-shadow:0 1px 1px #0001;

    clear:both;
}


/* Received */

.received{
    margin-right:auto;

    background:white;

    border-top-left-radius:2px;
}


/* Sent */

.sent{
    margin-left:auto;

    background:#d9fdd3;

    border-top-right-radius:2px;
}


/* Time */

.message-time{
    float:right;

    margin:

        5px 0 0 12px;

    font-size:10px;

    color:#667781;
}


/* Double tick */

.ticks{
    color:#53a9e6;

    font-size:13px;

    margin-left:2px;
}


/* =========================
   MESSAGE INPUT
========================= */

.input-area{
    min-height:68px;

    background:#f0f2f5;

    display:flex;

    align-items:center;

    gap:8px;

    padding:9px 13px;
}


/* Attachment */

.attach{
    border:none;

    background:none;

    font-size:24px;

    color:#536168;

    cursor:pointer;

    padding:6px;
}


/* Input */

.message-input{
    flex:1;

    min-width:0;

    height:46px;

    border:none;

    outline:none;

    background:white;

    border-radius:9px;

    padding:0 15px;

    font-size:15px;
}


/* Send */

.send-button{
    width:46px;
    height:46px;

    border:none;

    border-radius:50%;

    background:#00a884;

    color:white;

    font-size:19px;

    cursor:pointer;

    transition:.15s;
}

.send-button:hover{
    background:#008f72;

    transform:scale(1.04);
}


/* =========================
   EMPTY SCREEN
========================= */

.empty-screen{
    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:#f0f2f5;

    color:#667781;

    text-align:center;
}

.empty-icon{
    font-size:58px;

    margin-bottom:12px;
}

.empty-screen h2{
    font-size:24px;

    color:#415058;
}

.empty-screen p{
    margin-top:8px;

    font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .sidebar{
        width:100%;
        max-width:none;
    }

    .chat{
        display:none;
    }

    .sidebar.chat-open{
        display:none;
    }

    .chat.chat-open{
        display:flex;
    }

    .back-button{
        display:block;
    }

    .messages{
        padding:18px 3.5%;
    }

    .message{
        max-width:84%;
    }

    .header-buttons{
        gap:14px;
    }

    .sidebar-header,
    .chat-header{
        height:64px;
    }
}

</style>
</head>


<body>


<div class="app">


<!-- =====================================
     USERS SIDEBAR
====================================== -->

<aside class="sidebar" id="sidebar">


    <div class="sidebar-header">

        <div class="sidebar-title">
            Chats
        </div>

        <div class="header-icons">

            <button class="icon">
                ✎
            </button>

            <button class="icon">
                ⋮
            </button>

        </div>

    </div>


    <!-- Search -->

    <div class="search-container">

        <div class="search-box">

            <span>⌕</span>

            <input
                id="search"
                type="text"
                placeholder="Search or start new chat"
                oninput="searchUsers()"
            >

        </div>

    </div>


    <!-- Users -->

    <div
        class="users"
        id="users"
    ></div>


</aside>



<!-- =====================================
     CHAT
====================================== -->

<main
    class="chat"
    id="chat"
>


    <!-- Empty screen -->

    <div
        class="empty-screen"
        id="emptyScreen"
    >

        <div class="empty-icon">
            💬
        </div>

        <h2>
            Select a chat
        </h2>

        <p>
            Choose a user from the left to start messaging.
        </p>

    </div>



    <!-- Chat screen -->

    <div
        id="chatScreen"
        style="
            display:none;
            flex:1;
            flex-direction:column;
            min-height:0;
        "
    >


        <!-- CHAT HEADER -->

        <header class="chat-header">


            <button
                class="back-button"
                onclick="backToUsers()"
            >
                ‹
            </button>


            <div
                class="header-avatar"
                id="headerAvatar"
            >
                U1
            </div>


            <div class="header-info">

                <div
                    class="header-name"
                    id="headerName"
                >
                    User 1
                </div>

                <div
                    class="header-status"
                    id="headerStatus"
                >
                    Not connected
                </div>

            </div>


            <!-- ONLY CALL + MORE -->

            <div class="header-buttons">

                <button
                    onclick="callUser()"
                    title="Call"
                >
                    ☎
                </button>


                <button
                    onclick="moreOptions()"
                    title="More"
                >
                    ⋮
                </button>

            </div>


        </header>



        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
        ></section>



        <!-- INPUT -->

        <div class="input-area">


            <button
                class="attach"
                title="Attachment"
            >
                ⊕
            </button>


            <input
                class="message-input"
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                onkeydown="handleEnter(event)"
            >


            <button
                class="send-button"
                onclick="sendMessage()"
            >
                ➤
            </button>


        </div>


    </div>


</main>


</div>



<script>

/* =====================================
   USERS DATA
====================================== */

const users = [

    {
        id:1,
        name:"User 1",
        preview:"Chat with User 1 opened.",
        time:"10:42 PM",
        unread:2
    },

    {
        id:2,
        name:"User 2",
        preview:"Tap to start chatting",
        time:"9:18 PM",
        unread:0
    },

    {
        id:3,
        name:"User 3",
        preview:"Not connected",
        time:"Yesterday",
        unread:0
    }

];


let currentUser = null;


/* Messages storage */

let chats = {};


/* =====================================
   RENDER USERS
====================================== */

function renderUsers(list = users){

    const usersContainer =
        document.getElementById("users");


    usersContainer.innerHTML = "";


    list.forEach(user => {

        const userElement =
            document.createElement("div");


        userElement.className =
            "user " +
            (currentUser === user.id
                ? "active"
                : "");


        userElement.onclick =
            () => openChat(user.id);


        userElement.innerHTML = `

            <div class="avatar">
                U${user.id}
            </div>


            <div class="user-info">

                <div class="user-row">

                    <div class="user-name">
                        ${user.name}
                    </div>

                    <div class="user-time">
                        ${user.time}
                    </div>

                </div>


                <div class="user-row">

                    <div class="preview">
                        ${user.preview}
                    </div>

                    ${
                        user.unread > 0
                        ?
                        `<div class="unread">
                            ${user.unread}
                         </div>`
                        :
                        ""
                    }

                </div>

            </div>

        `;


        usersContainer.appendChild(
            userElement
        );

    });

}


/* Initial users */

renderUsers();



/* =====================================
   OPEN CHAT
====================================== */

function openChat(id){

    currentUser = id;


    const user =
        users.find(
            u => u.id === id
        );


    /* Hide empty screen */

    document.getElementById(
        "emptyScreen"
    ).style.display = "none";


    /* Show chat */

    document.getElementById(
        "chatScreen"
    ).style.display = "flex";


    /* Header */

    document.getElementById(
        "headerName"
    ).textContent = user.name;


    document.getElementById(
        "headerAvatar"
    ).textContent =
        "U" + id;


    /* Create chat */

    if(!chats[id]){
        chats[id] = [];
    }


    if(chats[id].length > 0){

        document.getElementById(
            "headerStatus"
        ).textContent = "Online";

    }else{

        document.getElementById(
            "headerStatus"
        ).textContent =
            "Not connected";

    }


    renderMessages();


    renderUsers();


    /* Mobile */

    if(window.innerWidth <= 760){

        document.getElementById(
            "sidebar"
        ).classList.add(
            "chat-open"
        );


        document.getElementById(
            "chat"
        ).classList.add(
            "chat-open"
        );

    }


    document.getElementById(
        "messageInput"
    ).focus();

}



/* =====================================
   RENDER MESSAGES
====================================== */

function renderMessages(){

    const messages =
        document.getElementById(
            "messages"
        );


    messages.innerHTML = `

        <div class="date">
            TODAY
        </div>

    `;


    /* No messages */

    if(
        !chats[currentUser] ||
        chats[currentUser].length === 0
    ){

        messages.innerHTML += `

            <div class="security">
                🔒 Messages are end-to-end secured
            </div>

            <div class="not-connected">
                Not connected
            </div>

        `;

        return;

    }


    /* Messages */

    chats[currentUser].forEach(
        message => {

            messages.innerHTML += `

                <div class="
                    message
                    ${message.sent
                        ? "sent"
                        : "received"}
                ">

                    ${escapeHTML(
                        message.text
                    )}

                    <span
                        class="message-time"
                    >

                        ${message.time}

                        ${
                            message.sent
                            ?
                            `<span class="ticks">
                                ✓✓
                             </span>`
                            :
                            ""
                        }

                    </span>

                </div>

            `;

        }
    );


    messages.scrollTop =
        messages.scrollHeight;

}



/* =====================================
   SEND MESSAGE
====================================== */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(
        text === "" ||
        currentUser === null
    ){
        return;
    }


    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    if(!chats[currentUser]){
        chats[currentUser] = [];
    }


    chats[currentUser].push({

        text:text,

        time:time,

        sent:true

    });


    /* Online status */

    document.getElementById(
        "headerStatus"
    ).textContent =
        "Online";


    /* Update user preview */

    const user =
        users.find(
            u => u.id === currentUser
        );


    user.preview = text;

    user.time = time;

    user.unread = 0;


    input.value = "";


    renderMessages();

    renderUsers();

}



/* =====================================
   ENTER TO SEND
====================================== */

function handleEnter(event){

    if(event.key === "Enter"){

        sendMessage();

    }

}



/* =====================================
   BACK
====================================== */

function backToUsers(){

    document.getElementById(
        "sidebar"
    ).classList.remove(
        "chat-open"
    );


    document.getElementById(
        "chat"
    ).classList.remove(
        "chat-open"
    );

}



/* =====================================
   CALL
====================================== */

function callUser(){

    const user =
        users.find(
            u => u.id === currentUser
        );


    alert(
        "Calling " +
        user.name +
        "..."
    );

}



/* =====================================
   MORE
====================================== */

function moreOptions(){

    alert(

        "More options\n\n" +

        "• Contact info\n" +

        "• Search\n" +

        "• Clear chat\n" +

        "• Block"

    );

}



/* =====================================
   SEARCH
====================================== */

function searchUsers(){

    const query =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    const filtered =
        users.filter(
            user =>
                user.name
                    .toLowerCase()
                    .includes(query)
        );


    renderUsers(filtered);

}



/* =====================================
   SECURITY
====================================== */

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,

        character => ({

            "&":"&amp;",

            "<":"&lt;",

            ">":"&gt;",

            '"':"&quot;",

            "'":"&#039;"

        }[character])

    );

}

</script>

</body>
</html>

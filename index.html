<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RG Esports x Rare Gaming | Tournament</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Teko:wght@600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="form-card">
    <div class="header">
      <h2>RG ESPORTS x RARE GAMING</h2>
      <p>Official Tournament Registration</p>
    </div>

    <form id="registrationForm">
      
      <!-- Team Info Section -->
      <div class="section-title">TEAM INFORMATION</div>
      <div class="input-group">
        <input type="text" id="teamName" placeholder="Team Name" required>
      </div>
      
      <div class="row">
        <div class="input-group">
          <input type="text" id="captainName" placeholder="Captain Name" required>
        </div>
        <div class="input-group">
          <input type="tel" id="whatsappNo" placeholder="WhatsApp Number" required>
        </div>
      </div>

      <!-- Players Info Section -->
      <div class="section-title">PLAYERS DETAILS</div>

      <!-- Player 1 -->
      <div class="row player-row">
        <input type="text" id="p1Name" placeholder="Player 1 Name (Captain)" required>
        <input type="text" id="p1UID" placeholder="Player 1 UID" required>
      </div>

      <!-- Player 2 -->
      <div class="row player-row">
        <input type="text" id="p2Name" placeholder="Player 2 Name" required>
        <input type="text" id="p2UID" placeholder="Player 2 UID" required>
      </div>

      <!-- Player 3 -->
      <div class="row player-row">
        <input type="text" id="p3Name" placeholder="Player 3 Name" required>
        <input type="text" id="p3UID" placeholder="Player 3 UID" required>
      </div>

      <!-- Player 4 -->
      <div class="row player-row">
        <input type="text" id="p4Name" placeholder="Player 4 Name" required>
        <input type="text" id="p4UID" placeholder="Player 4 UID" required>
      </div>

      <!-- Substitute Player (Optional) -->
      <div class="row player-row optional">
        <input type="text" id="subName" placeholder="Sub Player Name (Optional)">
        <input type="text" id="subUID" placeholder="Sub Player UID (Optional)">
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn">REGISTER TEAM</button>
    </form>
  </div>

</body>
</html>

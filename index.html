<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Royale - Custom Web Lobby</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Impact, sans-serif; }
    
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: radial-gradient(circle at center, #2d1806 0%, #0a0502 100%);
      color: #fff; display: flex; flex-direction: column; justify-content: space-between;
      position: relative;
    }

    /* 1. TOP HEADER */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 25px; z-index: 10;
    }
    .profile-card {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0, 0, 0, 0.65); padding: 5px 12px; border-radius: 6px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    .avatar-icon {
      width: 42px; height: 42px; border-radius: 4px; border: 2px solid #e67e22;
      background: #111; object-fit: cover;
    }
    .profile-info { display: flex; flex-direction: column; }
    .name-wrapper { display: flex; align-items: center; gap: 6px; }
    .profile-name {
      font-size: 14px; font-weight: bold; color: #f1c40f; letter-spacing: 0.5px;
      background: transparent; border: none; outline: none; max-width: 140px;
    }
    .edit-btn { cursor: pointer; font-size: 12px; color: #aaa; }
    .edit-btn:hover { color: #fff; }
    .profile-uid { font-size: 11px; color: #aaa; }

    .currencies {
      display: flex; gap: 15px; background: rgba(0,0,0,0.5); padding: 6px 16px;
      border-radius: 20px; border: 1px solid #443;
    }
    .curr-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; }
    .gold { color: #f39c12; }
    .diamond { color: #00d2d3; }

    .top-actions { display: flex; gap: 10px; }
    .btn-action {
      background: linear-gradient(180deg, #e67e22, #d35400); color: #fff;
      border: 1px solid #f39c12; padding: 7px 15px; font-size: 12px; font-weight: bold;
      border-radius: 4px; cursor: pointer; text-transform: uppercase;
    }
    .btn-action:hover { filter: brightness(1.2); }

    /* 2. LEFT SIDE MENU */
    .left-menu {
      position: absolute; left: 20px; top: 120px;
      display: flex; flex-direction: column; gap: 12px; z-index: 10;
    }
    .menu-icon-btn {
      width: 48px; height: 48px; background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; font-size: 10px; color: #eee;
    }
    .menu-icon-btn:hover { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); transform: scale(1.05); }

    /* 3. CENTER STAGE */
    .center-stage {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -42%);
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
    }
    .character-img-wrap {
      position: relative; animation: idleBreathe 3s ease-in-out infinite alternate;
    }
    .char-sprite {
      height: 400px; max-height: 55vh; object-fit: contain; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
    }
    @keyframes idleBreathe {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.01); }
    }
    
    .stage-floor {
      width: 260px; height: 35px; background: radial-gradient(ellipse, #f39c12 0%, transparent 70%);
      border-radius: 50%; margin-top: -25px; filter: blur(4px);
    }

    .char-nameplate {
      margin-top: 5px; background: rgba(0, 0, 0, 0.75); padding: 4px 20px;
      border-radius: 4px; border: 1px solid #f39c12; font-size: 13px; font-weight: bold;
      color: #f1c40f; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
    }

    /* 4. BOTTOM BAR */
    .bottom-bar {
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 20px 30px; z-index: 10;
    }
    .bottom-slots {
      display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 6px;
    }
    .slot-item {
      width: 44px; height: 44px; background: #1a1a1a; border: 1px solid #444;
      border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    .match-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .mode-badge {
      background: rgba(0, 0, 0, 0.85); border: 2px solid #f39c12; border-radius: 6px;
      padding: 8px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .mode-title { font-size: 14px; font-weight: 900; color: #fff; text-transform: uppercase; }
    .mode-sub { font-size: 11px; color: #f1c40f; }

    .start-btn {
      background: linear-gradient(180deg, #ffbe1a 0%, #e67e22 100%);
      border: 2px solid #fff; border-radius: 8px;
      color: #000; font-size: 26px; font-weight: 900; font-style: italic;
      padding: 12px 65px; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 25px rgba(243, 156, 18, 0.7); transition: 0.15s;
    }
    .start-btn:hover { transform: scale(1.05); filter: brightness(1.15); }

    /* 5. MODALS */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px);
    }
    .modal-box {
      background: #15181f; width: 480px; border-radius: 10px; padding: 22px;
      border: 1px solid #f39c12; box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    .modal-title { font-size: 18px; color: #f1c40f; margin-bottom: 15px; text-transform: uppercase; }
    
    /* Upload Section inside Modal */
    .upload-box {
      background: #232733; border: 2px dashed #f39c12; border-radius: 6px;
      padding: 12px; text-align: center; margin-bottom: 15px; cursor: pointer;
    }
    .upload-box input { display: none; }
    .upload-box label { cursor: pointer; font-size: 13px; font-weight: bold; color: #f1c40f; }

    /* Character Cards */
    .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; max-height: 220px; overflow-y: auto; }
    .char-card {
      background: #232733; border: 2px solid transparent; border-radius: 6px;
      padding: 8px; cursor: pointer; text-align: center; transition: 0.2s;
    }
    .char-card.active, .char-card:hover { border-color: #f39c12; background: #2f3640; }
    .char-card img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
    .char-card p { font-size: 11px; font-weight: bold; }

    .room-opt-btn {
      width: 100%; padding: 12px; background: #2c3e50; color: #fff;
      border: 1px solid #475a6f; border-radius: 6px; margin-bottom: 10px;
      font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .room-opt-btn:hover { background: #e67e22; border-color: #f39c12; }
    .close-btn { background: #c0392b; width: 100%; padding: 8px; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. Top Header -->
  <div class="top-bar">
    <div class="profile-card">
      <img id="profileAvatar" class="avatar-icon" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="Avatar">
      <div class="profile-info">
        <div class="name-wrapper">
          <input type="text" id="usernameInput" class="profile-name" value="NEW USER" maxlength="14" onchange="saveUsername()">
          <span class="edit-btn" onclick="document.getElementById('usernameInput').focus()">✏️</span>
        </div>
        <span class="profile-uid">UID: <b id="displayUid">000000</b></span>
      </div>
    </div>

    <div class="currencies">
      <div class="curr-item gold">🪙 <span>10,000</span></div>
      <div class="curr-item diamond">💎 <span>100</span></div>
    </div>

    <div class="top-actions">
      <button class="btn-action" onclick="openModal('roomModal')">Create Room</button>
      <button class="btn-action" style="background: #2980b9; border-color:#3498db;" onclick="openModal('joinModal')">Join Room</button>
    </div>
  </div>

  <!-- 2. Left Side Menu -->
  <div class="left-menu">
    <div class="menu-icon-btn" onclick="openModal('charModal')">
      <span style="font-size: 18px;">👤</span>
      <span>HERO</span>
    </div>
    <div class="menu-icon-btn">
      <span style="font-size: 18px;">🎒</span>
      <span>VAULT</span>
    </div>
    <div class="menu-icon-btn">
      <span style="font-size: 18px;">🔫</span>
      <span>ARMORY</span>
    </div>
  </div>

  <!-- 3. Center Character Stage -->
  <div class="center-stage">
    <div class="character-img-wrap">
      <!-- यह आपकी सेलेक्टेड JPG इमेज लोड करेगा -->
      <img id="equippedCharImg" class="char-sprite" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60" alt="Character">
    </div>
    <div class="stage-floor"></div>
    <div class="char-nameplate">
      <span>👑</span>
      <span id="charNameDisplay">DEFAULT CHARACTER</span>
    </div>
  </div>

  <!-- 4. Bottom Match Controls -->
  <div class="bottom-bar">
    <div class="bottom-slots">
      <div class="slot-item">💣</div>
      <div class="slot-item">🛡️</div>
      <div class="slot-item">⚡</div>
    </div>

    <div class="match-controls">
      <div class="mode-badge" onclick="openModal('roomModal')">
        <span style="font-size: 22px;">🏆</span>
        <div>
          <div class="mode-title" id="selectedModeText">BR-RANKED (SOLO)</div>
          <div class="mode-sub">Map: Arena Map</div>
        </div>
      </div>
      <button class="start-btn" id="startBtn" onclick="launchMatch()">START</button>
    </div>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- Character Selector & JPG Uploader Modal -->
  <div class="modal-overlay" id="charModal">
    <div class="modal-box">
      <div class="modal-title">Equip Character JPG</div>
      
      <!-- Upload Custom JPG -->
      <div class="upload-box" onclick="document.getElementById('charFileInput').click()">
        <label>📁 Click here to Upload your Character JPG</label>
        <input type="file" id="charFileInput" accept="image/jpeg, image/png" onchange="handleFileUpload(event)">
      </div>

      <!-- Character Slots (यहाँ आप अपनी पसंद की डिफ़ॉल्ट JPGs सेट कर सकते हैं) -->
      <div class="char-grid" id="charGrid">
        <div class="char-card active" onclick="equipHero('SLOT 1', 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60')">
          <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60">
          <p>Slot 1</p>
        </div>
        <div class="char-card" onclick="equipHero('SLOT 2', 'https://images.unsplash.com/photo-1563089145-599997674d42?w=500&auto=format&fit=crop&q=60')">
          <img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=500&auto=format&fit=crop&q=60">
          <p>Slot 2</p>
        </div>
        <div class="char-card" onclick="equipHero('SLOT 3', 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60')">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60">
          <p>Slot 3</p>
        </div>
      </div>
      <button class="close-btn" onclick="closeModals()">CONFIRM & CLOSE</button>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="roomModal">
    <div class="modal-box">
      <div class="modal-title">Create Custom Room</div>
      <button class="room-opt-btn" onclick="setMode('SOLO (1v1)')">SOLO (1v1 Custom Room)</button>
      <button class="room-opt-btn" onclick="setMode('DUO (2v2)')">DUO (2v2 Team Match)</button>
      <button class="room-opt-btn" onclick="setMode('SQUAD (4v4)')">SQUAD (4v4 Classic)</button>
      <button class="close-btn" onclick="closeModals()">CANCEL</button>
    </div>
  </div>

  <!-- Join Room Modal -->
  <div class="modal-overlay" id="joinModal">
    <div class="modal-box">
      <div class="modal-title">Enter Room UID</div>
      <input type="text" id="joinUidInput" placeholder="Enter Room Code" style="width:100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #f39c12; color: #fff; font-size: 16px; border-radius: 4px;">
      <button class="room-opt-btn" style="background:#27ae60;" onclick="joinMatchWithCode()">JOIN MATCH</button>
      <button class="close-btn" onclick="closeModals()">BACK</button>
    </div>
  </div>

  <script>
    // Initial State & Storage
    const currentUid = Math.floor(100000 + Math.random() * 900000);
    document.getElementById('displayUid').innerText = currentUid;

    let selectedCharacter = {
      name: 'DEFAULT CHARACTER',
      img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60'
    };

    function saveUsername() {
      const name = document.getElementById('usernameInput').value.trim();
      localStorage.setItem('game_username', name);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function equipHero(name, imgUrl) {
      selectedCharacter.name = name;
      selectedCharacter.img = imgUrl;

      document.getElementById('equippedCharImg').src = imgUrl;
      document.getElementById('charNameDisplay').innerText = name;
      localStorage.setItem('equipped_character', imgUrl);
      closeModals();
    }

    // Handle Local JPG File Upload
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const customImgUrl = e.target.result;
          equipHero('CUSTOM HERO', customImgUrl);
          
          // Add to Grid
          const newCard = document.createElement('div');
          newCard.className = 'char-card active';
          newCard.onclick = () => equipHero('CUSTOM HERO', customImgUrl);
          newCard.innerHTML = `<img src="${customImgUrl}"><p>Custom</p>`;
          document.getElementById('charGrid').prepend(newCard);
        };
        reader.readAsDataURL(file);
      }
    }

    function setMode(mode) {
      document.getElementById('selectedModeText').innerText = `BR: ${mode}`;
      closeModals();
      const customCode = Math.floor(1000 + Math.random() * 9000);
      alert(`Room Created!\nShare UID with friends: ${customCode}`);
    }

    function joinMatchWithCode() {
      const code = document.getElementById('joinUidInput').value.trim();
      if (!code) return alert('कृपया Room Code दर्ज करें!');
      alert(`Connecting to Room UID: ${code}...`);
      closeModals();
    }

    function launchMatch() {
      const username = document.getElementById('usernameInput').value;
      alert(`Starting Match as "${username}"!\nLoading Map...`);
    }
  </script>
</body>
</html>

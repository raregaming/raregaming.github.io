<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RARE GAMING x RG ESPORTS | Official</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background: #050508;
      /* Ultra Gaming Background with Glow Overlay */
      background-image: 
        linear-gradient(rgba(5, 5, 8, 0.85), rgba(5, 5, 8, 0.95)),
        url('https://i.ibb.co/L5Q7PHz/ff-bg.jpg'); /* Standard Gaming BG Fallback */
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-container {
      text-align: center;
      padding: 20px;
      max-width: 600px;
      animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Animated Logos Section */
    .logos-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .logo-img {
      width: clamp(90px, 20vw, 130px);
      height: clamp(90px, 20vw, 130px);
      border-radius: 50%;
      border: 3px solid #00e6ff;
      box-shadow: 0 0 25px rgba(0, 230, 255, 0.6);
      animation: float 3s ease-in-out infinite alternate;
      object-fit: cover;
    }

    .logo-img.rg {
      border-color: #a125ff;
      box-shadow: 0 0 25px rgba(161, 37, 255, 0.6);
      animation-delay: 1.5s;
    }

    .vs-badge {
      font-size: 28px;
      color: #ff4655;
      font-weight: 900;
      text-shadow: 0 0 15px #ff4655;
      animation: pulse 1s infinite alternate;
    }

    /* Main Animated Title */
    .title-banner {
      font-size: clamp(24px, 6vw, 42px);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 70, 85, 0.8);
    }

    .title-banner span {
      background: linear-gradient(90deg, #a125ff, #ff4655, #00e6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-title {
      font-family: 'Rajdhani', sans-serif;
      color: #00e6ff;
      font-size: 18px;
      letter-spacing: 4px;
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    /* Glowing Action Button */
    .register-btn {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      padding: 18px 30px;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #ff4655, #a125ff);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(255, 70, 85, 0.6);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .register-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(0, 230, 255, 0.8);
      background: linear-gradient(135deg, #00e6ff, #ff4655);
    }

    /* Keyframe Animations */
    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    
    <!-- Animated Logos -->
    <div class="logos-wrapper">
      <!-- RG Esports Logo -->
      <img src="https://i.ibb.co/RG-Esports-Logo.jpg" alt="RG Esports" class="logo-img rg">
      <div class="vs-badge">X</div>
      <!-- Rare Gaming Logo -->
      <img src="https://i.ibb.co/Rare-Gaming-Logo.jpg" alt="Rare Gaming" class="logo-img">
    </div>

    <!-- Title -->
    <h1 class="title-banner">RARE GAMING <span>X</span> RG ESPORTS</h1>
    <p class="sub-title">OFFICIAL TOURNAMENT SEASON 1</p>

    <!-- Navigation Button -->
    <a href="register.html" class="register-btn">🔥 REGISTER NOW</a>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Arena Shooter</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #ui { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
    input, button { padding: 8px 12px; font-size: 14px; border: none; border-radius: 4px; }
    button { background: #ff4757; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #e84118; }
    canvas { background: #2f3542; border: 2px solid #57606f; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="ui">
    <button id="hostBtn">Create Room (Host)</button>
    <span>या</span>
    <input type="text" id="roomIdInput" placeholder="Enter Host UID">
    <button id="joinBtn">Join Room</button>
    <span id="status" style="font-weight:bold; color:#7bed9f; margin-left: 10px;">Status: Disconnected</span>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let peer = null;
    let connections = [];
    let isHost = false;

    // गेम स्टेट
    const myId = Math.random().toString(36).substring(2, 7);
    const players = {};
    const bullets = [];
    const keys = {};

    players[myId] = {
      x: 100 + Math.random() * 600,
      y: 100 + Math.random() * 300,
      hp: 100,
      angle: 0,
      color: '#' + Math.floor(Math.random()*16777215).toString(16)
    };

    // 1. Host Room Setup
    document.getElementById('hostBtn').onclick = () => {
      const roomUid = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('arena-' + roomUid);

      peer.on('open', (id) => {
        isHost = true;
        statusText.innerText = `Room Active! Your UID: ${roomUid}`;
        document.getElementById('hostBtn').disabled = true;
        document.getElementById('joinBtn').disabled = true;
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleData(data, conn));
      });
    };

    // 2. Join Room Setup
    document.getElementById('joinBtn').onclick = () => {
      const targetUid = document.getElementById('roomIdInput').value.trim();
      if (!targetUid) return alert('UID दर्ज करें!');

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect('arena-' + targetUid);
        connections.push(conn);

        conn.on('open', () => {
          statusText.innerText = `Connected to Room: ${targetUid}`;
          document.getElementById('hostBtn').disabled = true;
          document.getElementById('joinBtn').disabled = true;
        });

        conn.on('data', (data) => handleData(data, conn));
      });
    };

    // 3. डेटा ब्रॉडकास्ट और रिसीव
    function broadcast(data) {
      connections.forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    function handleData(data, conn) {
      if (data.type === 'update') {
        players[data.id] = data.player;
        if (isHost) {
          // होस्ट सभी प्लेयर्स को डेटा री-ब्रॉडकास्ट करता है
          broadcast(data);
        }
      } else if (data.type === 'shoot') {
        bullets.push(data.bullet);
        if (isHost) broadcast(data);
      }
    }

    // 4. कंट्रोल्स (WASD + Mouse)
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const me = players[myId];
      if (me) {
        me.angle = Math.atan2(mouseY - me.y, mouseX - me.x);
      }
    });

    canvas.addEventListener('mousedown', () => {
      const me = players[myId];
      if (!me || me.hp <= 0) return;

      const bullet = {
        x: me.x + Math.cos(me.angle) * 20,
        y: me.y + Math.sin(me.angle) * 20,
        vx: Math.cos(me.angle) * 8,
        vy: Math.sin(me.angle) * 8,
        owner: myId
      };

      bullets.push(bullet);
      broadcast({ type: 'shoot', bullet: bullet });
    });

    // 5. गेम लूप (60 FPS)
    function update() {
      const me = players[myId];
      if (me && me.hp > 0) {
        const speed = 3;
        if (keys['w'] || keys['arrowup']) me.y = Math.max(15, me.y - speed);
        if (keys['s'] || keys['arrowdown']) me.y = Math.min(canvas.height - 15, me.y + speed);
        if (keys['a'] || keys['arrowleft']) me.x = Math.max(15, me.x - speed);
        if (keys['d'] || keys['arrowright']) me.x = Math.min(canvas.width - 15, me.x + speed);

        broadcast({ type: 'update', id: myId, player: me });
      }

      // गोलियों का मूवमेंट और कॉलिजन
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // दीवार से टकराने पर हटाना
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
          continue;
        }

        // प्लेयर डैमेज चेक
        if (b.owner !== myId && me && me.hp > 0) {
          const dist = Math.hypot(b.x - me.x, b.y - me.y);
          if (dist < 15) {
            me.hp -= 20;
            bullets.splice(i, 1);
            broadcast({ type: 'update', id: myId, player: me });
          }
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // गोलियां रेंडर करना
      ctx.fillStyle = '#f1c40f';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // प्लेयर्स रेंडर करना
      for (let id in players) {
        const p = players[id];
        if (p.hp <= 0) continue;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // गन बैरल
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(0, -3, 20, 6);

        // कैरेक्टर बॉडी
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        // हेल्थ बार
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(p.x - 20, p.y - 25, 40, 5);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(p.x - 20, p.y - 25, (p.hp / 100) * 40, 5);
      }

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Royale - Login & Sign Up</title>
  
  <!-- Firebase SDKs (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Impact, sans-serif; user-select: none; }
    
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: radial-gradient(circle at center, #2e1503 0%, #080402 100%);
      display: flex; align-items: center; justify-content: center; color: #fff;
    }

    .auth-card {
      width: 420px; max-width: 90vw; background: rgba(18, 20, 29, 0.95);
      border: 2px solid #f39c12; border-radius: 12px; padding: 30px;
      box-shadow: 0 0 40px rgba(243, 156, 18, 0.35); backdrop-filter: blur(10px);
    }

    .game-logo { text-align: center; margin-bottom: 22px; }
    .game-logo h1 {
      font-size: 26px; font-weight: 900; font-style: italic; color: #f1c40f;
      letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }
    .game-logo p { font-size: 11px; color: #a4b0be; letter-spacing: 2px; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 10px; background: #2f3640; border: none;
      color: #aaa; font-weight: bold; font-size: 13px; border-radius: 4px;
      cursor: pointer; transition: 0.2s; text-transform: uppercase;
    }
    .tab-btn.active {
      background: #e67e22; color: #fff; box-shadow: 0 0 12px rgba(230, 126, 34, 0.5);
    }

    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block; font-size: 11px; font-weight: bold; color: #f39c12;
      margin-bottom: 6px; text-transform: uppercase;
    }
    .input-group input {
      width: 100%; padding: 12px; background: #10121a; border: 1px solid #444;
      border-radius: 5px; color: #fff; font-size: 14px; outline: none; transition: 0.2s;
    }
    .input-group input:focus {
      border-color: #f1c40f; box-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
    }

    .submit-btn {
      width: 100%; padding: 14px; margin-top: 10px;
      background: linear-gradient(180deg, #ffbe1a 0%, #e67e22 100%);
      border: 2px solid #fff; border-radius: 6px; color: #000;
      font-size: 18px; font-weight: 900; font-style: italic; cursor: pointer;
      text-transform: uppercase; transition: 0.2s; box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
    }
    .submit-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

    .msg-box {
      font-size: 12px; text-align: center; margin-top: 14px; font-weight: bold; min-height: 18px; line-height: 1.4;
    }
    .error { color: #ff4757; }
    .success { color: #2ed573; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="game-logo">
      <h1>Battle Royale</h1>
      <p>PLAYER AUTHENTICATION</p>
    </div>

    <!-- Switch Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Auth Form -->
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="input-group">
        <label id="userLabel">Username or Game UID</label>
        <input type="text" id="userInput" placeholder="Enter Username or UID" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required minlength="4">
      </div>

      <button type="submit" class="submit-btn" id="actionBtn">ENTER LOBBY</button>
    </form>

    <div class="msg-box" id="msgText"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. FIREBASE CONFIGURATION
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCfqpRmqcliODqQksN9oNQKkM2w8V-uJQM",
      authDomain: "rare-gaming-aee10.firebaseapp.com",
      databaseURL: "https://rare-gaming-aee10-default-rtdb.firebaseio.com",
      projectId: "rare-gaming-aee10",
      storageBucket: "rare-gaming-aee10.firebasestorage.app",
      messagingSenderId: "685609870873",
      appId: "1:685609870873:web:eb82d4d123c123fe1c6c88"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // -------------------------------------------------------------
    // 2. TAB SWITCHING
    // -------------------------------------------------------------
    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('msgText').innerText = '';
      document.getElementById('userInput').value = '';
      document.getElementById('passwordInput').value = '';

      if (mode === 'login') {
        document.getElementById('loginTabBtn').classList.add('active');
        document.getElementById('signupTabBtn').classList.remove('active');
        document.getElementById('userLabel').innerText = 'Username or Game UID';
        document.getElementById('userInput').placeholder = 'Enter Username or UID';
        document.getElementById('actionBtn').innerText = 'ENTER LOBBY';
      } else {
        document.getElementById('signupTabBtn').classList.add('active');
        document.getElementById('loginTabBtn').classList.remove('active');
        document.getElementById('userLabel').innerText = 'Choose Unique Username';
        document.getElementById('userInput').placeholder = 'e.g. Rare_Player';
        document.getElementById('actionBtn').innerText = 'CREATE ACCOUNT';
      }
    }

    // -------------------------------------------------------------
    // 3. AUTH LOGIC (SIGN UP & LOGIN)
    // -------------------------------------------------------------
    async function handleAuth(e) {
      e.preventDefault();
      const userVal = document.getElementById('userInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const msgBox = document.getElementById('msgText');

      msgBox.className = 'msg-box';
      msgBox.innerText = 'Connecting to Server...';

      // Safe key formatting for Firebase Realtime Database
      const usernameKey = encodeURIComponent(userVal.toLowerCase().replace(/[\.#\$\[\]\s]/g, "_"));

      const timeout = setTimeout(() => {
        if (msgBox.innerText === 'Connecting to Server...') {
          msgBox.className = 'msg-box error';
          msgBox.innerText = 'Server connection timed out! Please verify Realtime Database Rules in Firebase Console.';
        }
      }, 5000);

      try {
        if (currentMode === 'signup') {
          // Check username availability
          const nameCheckSnap = await db.ref('usernames/' + usernameKey).once('value');
          clearTimeout(timeout);

          if (nameCheckSnap.exists()) {
            msgBox.className = 'msg-box error';
            msgBox.innerText = `Username "${userVal}" is already taken! Please choose another.`;
            return;
          }

          // Generate guaranteed unique 6-digit game UID
          let uniqueUid = '';
          let isUnique = false;
          while (!isUnique) {
            const tempUid = Math.floor(100000 + Math.random() * 900000).toString();
            const uidCheckSnap = await db.ref('uids/' + tempUid).once('value');
            if (!uidCheckSnap.exists()) {
              uniqueUid = tempUid;
              isUnique = true;
            }
          }

          // Save player records in Firebase
          const playerProfile = {
            username: userVal,
            uid: uniqueUid,
            password: password,
            gold: 0,
            diamonds: 0,
            equippedCharId: 1,
            createdAt: Date.now()
          };

          await db.ref('players/' + uniqueUid).set(playerProfile);
          await db.ref('usernames/' + usernameKey).set(uniqueUid);
          await db.ref('uids/' + uniqueUid).set(uniqueUid);

          saveSession(uniqueUid, userVal, 0, 0, 1);

          msgBox.className = 'msg-box success';
          msgBox.innerText = `Account created successfully! Your UID: ${uniqueUid}`;
          setTimeout(() => window.location.href = 'index.html', 1500);

        } else {
          // Login Verification
          let targetUid = null;

          const uidSnap = await db.ref('uids/' + userVal).once('value');
          if (uidSnap.exists()) {
            targetUid = userVal;
          } else {
            const nameSnap = await db.ref('usernames/' + usernameKey).once('value');
            if (nameSnap.exists()) {
              targetUid = nameSnap.val();
            }
          }
          clearTimeout(timeout);

          if (!targetUid) {
            msgBox.className = 'msg-box error';
            msgBox.innerText = 'Username or UID not found!';
            return;
          }

          const playerSnap = await db.ref('players/' + targetUid).once('value');
          const userData = playerSnap.val();

          if (userData.password !== password) {
            msgBox.className = 'msg-box error';
            msgBox.innerText = 'Incorrect password! Please try again.';
            return;
          }

          saveSession(userData.uid, userData.username, userData.gold || 0, userData.diamonds || 0, userData.equippedCharId || 1);

          msgBox.className = 'msg-box success';
          msgBox.innerText = `Welcome back, ${userData.username}! Redirecting...`;
          setTimeout(() => window.location.href = 'index.html', 1000);
        }

      } catch (err) {
        clearTimeout(timeout);
        msgBox.className = 'msg-box error';
        msgBox.innerText = 'Firebase Error: ' + err.message;
      }
    }

    function saveSession(uid, username, gold, diamonds, charId) {
      localStorage.setItem('game_uid', uid);
      localStorage.setItem('game_username', username);
      localStorage.setItem('game_gold', gold);
      localStorage.setItem('game_diamonds', diamonds);
      localStorage.setItem('equipped_char_id', charId);
    }
  </script>
</body>
</html>

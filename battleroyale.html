<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Battle Royale - Battleground Arena</title>
  
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Impact, sans-serif; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; color: #fff; }
    canvas { width: 100%; height: 100%; display: block; }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); }
    #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
    #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }

    /* Plane / Jump HUD */
    #flightHud {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 20;
    }
    .flight-status {
      background: rgba(0, 0, 0, 0.7); border: 1px solid #f39c12; padding: 8px 24px;
      border-radius: 20px; font-size: 15px; font-weight: bold; color: #f1c40f; letter-spacing: 1px;
    }
    .eject-btn {
      background: linear-gradient(180deg, #ff4757, #e84118); border: 2px solid #fff;
      color: #fff; font-size: 22px; font-weight: 900; font-style: italic;
      padding: 12px 50px; border-radius: 8px; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 25px rgba(255, 71, 87, 0.7); transition: 0.2s;
    }
    .eject-btn:hover { transform: scale(1.08); filter: brightness(1.2); }

    /* Game HUD */
    #gameHud {
      position: absolute; bottom: 25px; left: 25px; z-index: 20;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 18, 26, 0.85); border-left: 4px solid #2ed573;
      padding: 8px 18px; border-radius: 6px; font-size: 14px; font-weight: bold;
    }
    .alt-gauge {
      position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.6); border: 1px solid #555; width: 20px; height: 200px;
      border-radius: 10px; display: none; overflow: hidden;
    }
    #altBar { width: 100%; height: 100%; background: linear-gradient(180deg, #3498db, #2ecc71); }

    #zoneAlert {
      position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
      color: #ff4757; font-size: 16px; font-weight: bold; z-index: 20; text-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>

  <!-- Auth Verification -->
  <script>
    const sessionUid = localStorage.getItem('game_uid');
    const sessionUser = localStorage.getItem('game_username');
    if (!sessionUid || !sessionUser) {
      window.location.href = 'login.html';
    }
  </script>

  <div id="crosshair"></div>
  <div id="zoneAlert"></div>

  <!-- Flight / Ejection Controls -->
  <div id="flightHud">
    <div class="flight-status">✈️ AIRBORNE: OVER BERMUDA ISLAND</div>
    <button class="eject-btn" id="ejectBtn" onclick="ejectPlayer()">EJECT / JUMP [SPACE]</button>
  </div>

  <!-- Altitude Indicator -->
  <div class="alt-gauge" id="altGauge">
    <div id="altBar"></div>
  </div>

  <!-- Standard HUD -->
  <div id="gameHud">
    <div class="hud-card">
      <div>Player: <span style="color:#f1c40f;" id="hudPlayerName">PLAYER</span> (UID: <span id="hudUid">000000</span>)</div>
      <div>HP: <span id="hpVal" style="color:#2ed573;">100</span> / 100</div>
      <div>Weapon: <span id="weaponVal" style="color:#ffa502;">Fists / Unarmed</span></div>
      <div>Alive: <span id="aliveVal">10</span></div>
    </div>
  </div>

  <script>
    document.getElementById('hudPlayerName').innerText = sessionUser;
    document.getElementById('hudUid').innerText = sessionUid;

    // -------------------------------------------------------------
    // 1. THREE.JS 3D WORLD & ENVIRONMENT
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x81ecec);
    scene.fog = new THREE.FogExp2(0x81ecec, 0.0035);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffae6, 1.2);
    sunLight.position.set(300, 600, 200);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // Map Ground (Green Island Terrain)
    const MAP_SIZE = 2500;
    const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 64, 64);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x27ae60 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Buildings & Structures
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    for (let i = 0; i < 70; i++) {
      const h = 10 + Math.random() * 20;
      const w = 12 + Math.random() * 15;
      const bMat = new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x7f8c8d : 0x95a5a6 });
      const building = new THREE.Mesh(boxGeo, bMat);
      building.scale.set(w, h, w);
      building.position.set((Math.random() - 0.5) * 1600, h / 2, (Math.random() - 0.5) * 1600);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);
    }

    // Safe Zone Cylinder
    let zoneRadius = 900;
    const zoneMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(zoneRadius, zoneRadius, 200, 32, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x0984e3, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
    );
    zoneMesh.position.set(0, 100, 0);
    scene.add(zoneMesh);

    // -------------------------------------------------------------
    // 2. CARGO PLANE (AIRCRAFT) MODEL
    // -------------------------------------------------------------
    const planeGroup = new THREE.Group();
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.6, roughness: 0.3 });
    const wingMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, metalness: 0.5 });

    // Fuselage
    const body = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 60, 16), planeMat);
    body.rotation.x = Math.PI / 2;
    planeGroup.add(body);

    // Nose
    const nose = new THREE.Mesh(new THREE.ConeGeometry(6, 15, 16), planeMat);
    nose.rotation.x = -Math.PI / 2;
    nose.position.z = -37.5;
    planeGroup.add(nose);

    // Wings
    const wings = new THREE.Mesh(new THREE.BoxGeometry(80, 1.5, 12), wingMat);
    wings.position.set(0, 2, -5);
    planeGroup.add(wings);

    // Tail Fin
    const tail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 14, 10), wingMat);
    tail.position.set(0, 8, 25);
    planeGroup.add(tail);

    planeGroup.position.set(0, 420, -1100);
    scene.add(planeGroup);

    // -------------------------------------------------------------
    // 3. PLAYER CHARACTER MODEL & PARACHUTE
    // -------------------------------------------------------------
    const playerGroup = new THREE.Group();
    const pMat = new THREE.MeshLambertMaterial({ color: 0xff4757 });
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xffd32a });
    const darkMat = new THREE.MeshLambertMaterial({ color: 0x1e272e });

    const pHead = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skinMat);
    pHead.position.y = 3.6;
    playerGroup.add(pHead);

    const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.8), pMat);
    pBody.position.y = 2.1;
    playerGroup.add(pBody);

    const pArmL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.7, 0.5), pMat);
    pArmL.position.set(-1.05, 2.15, 0);
    playerGroup.add(pArmL);

    const pArmR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.7, 0.5), pMat);
    pArmR.position.set(1.05, 2.15, 0);
    playerGroup.add(pArmR);

    const pLegL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), darkMat);
    pLegL.position.set(-0.4, 0.8, 0);
    playerGroup.add(pLegL);

    const pLegR = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), darkMat);
    pLegR.position.set(0.4, 0.8, 0);
    playerGroup.add(pLegR);

    // 3D Parachute Canopy
    const chuteGroup = new THREE.Group();
    const chuteCanopy = new THREE.Mesh(
      new THREE.SphereGeometry(6, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xf39c12, side: THREE.DoubleSide })
    );
    chuteCanopy.position.y = 10;
    chuteGroup.add(chuteCanopy);
    chuteGroup.visible = false;
    playerGroup.add(chuteGroup);

    playerGroup.visible = false;
    scene.add(playerGroup);

    // -------------------------------------------------------------
    // 4. GAME STATES & FLIGHT / LANDING PHYSICS
    // -------------------------------------------------------------
    // States: 'PLANE' -> 'FREEFALL' -> 'PARACHUTE' -> 'GROUND'
    let gameState = 'PLANE';
    let playerPos = new THREE.Vector3(0, 420, -1100);
    let playerVelocity = new THREE.Vector3(0, 0, 0);
    let playerHp = 100;

    function ejectPlayer() {
      if (gameState !== 'PLANE') return;
      gameState = 'FREEFALL';
      document.getElementById('flightHud').style.display = 'none';
      document.getElementById('altGauge').style.display = 'block';

      playerPos.copy(planeGroup.position);
      playerGroup.position.copy(playerPos);
      playerGroup.visible = true;

      playerVelocity.set(0, -18, 55); // Initial forward dive velocity
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && gameState === 'PLANE') ejectPlayer();
    });

    // -------------------------------------------------------------
    // 5. FPS / GROUND CONTROLS (MOUSE LOOK & WASD)
    // -------------------------------------------------------------
    let isLocked = false;
    let yaw = 0, pitch = 0;
    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('click', () => {
      if (gameState === 'GROUND') document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      document.getElementById('crosshair').style.display = isLocked ? 'block' : 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked && gameState === 'GROUND') return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    });

    // -------------------------------------------------------------
    // 6. MAIN GAME LOOP
    // -------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // State 1: Inside Plane
      if (gameState === 'PLANE') {
        planeGroup.position.z += 90 * delta;
        camera.position.set(planeGroup.position.x, planeGroup.position.y + 15, planeGroup.position.z - 50);
        camera.lookAt(planeGroup.position.x, planeGroup.position.y, planeGroup.position.z + 100);

        // Auto-eject at end of map
        if (planeGroup.position.z > 800) ejectPlayer();
      }

      // State 2: Freefall (Skydiving)
      else if (gameState === 'FREEFALL') {
        playerVelocity.y -= 30 * delta;
        playerVelocity.y = Math.max(-85, playerVelocity.y); // Terminal freefall speed

        playerPos.addScaledVector(playerVelocity, delta);
        playerGroup.position.copy(playerPos);
        playerGroup.rotation.x = 0.8; // Skydive tilt

        camera.position.set(playerPos.x, playerPos.y + 8, playerPos.z - 18);
        camera.lookAt(playerPos.x, playerPos.y, playerPos.z + 20);

        // Auto-deploy parachute at 150m altitude
        if (playerPos.y <= 160) {
          gameState = 'PARACHUTE';
          chuteGroup.visible = true;
          playerGroup.rotation.x = 0;
        }

        updateAltGauge(playerPos.y);
      }

      // State 3: Parachuting
      else if (gameState === 'PARACHUTE') {
        playerVelocity.y = -18; // Gliding descent rate
        playerVelocity.z = 25;  // Forward glide

        playerPos.addScaledVector(playerVelocity, delta);
        playerGroup.position.copy(playerPos);

        camera.position.set(playerPos.x, playerPos.y + 10, playerPos.z - 22);
        camera.lookAt(playerPos.x, playerPos.y + 2, playerPos.z + 20);

        // Touchdown on Ground
        if (playerPos.y <= 0.1) {
          playerPos.y = 0;
          playerGroup.position.y = 0;
          chuteGroup.visible = false;
          gameState = 'GROUND';

          document.getElementById('altGauge').style.display = 'none';
          document.body.requestPointerLock();
        }

        updateAltGauge(playerPos.y);
      }

      // State 4: Landed on Ground (Standard Battle Royale Movement)
      else if (gameState === 'GROUND') {
        camera.rotation.set(0, 0, 0);
        camera.rotateY(yaw);
        camera.rotateX(pitch);

        const moveSpeed = 38 * delta;
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

        if (keys['KeyW']) playerPos.add(forward.clone().multiplyScalar(moveSpeed));
        if (keys['KeyS']) playerPos.add(forward.clone().multiplyScalar(-moveSpeed));
        if (keys['KeyA']) playerPos.add(right.clone().multiplyScalar(-moveSpeed));
        if (keys['KeyD']) playerPos.add(right.clone().multiplyScalar(moveSpeed));

        camera.position.set(playerPos.x, 3.5, playerPos.z);

        // Safe Zone Damage
        const distFromCenter = Math.hypot(playerPos.x, playerPos.z);
        if (distFromCenter > zoneRadius) {
          playerHp -= 6 * delta;
          document.getElementById('zoneAlert').innerText = "⚠️ DANGER: Outside Safe Zone!";
        } else {
          document.getElementById('zoneAlert').innerText = "";
        }
        document.getElementById('hpVal').innerText = Math.max(0, Math.floor(playerHp));
      }

      renderer.render(scene, camera);
    }

    function updateAltGauge(altitude) {
      const percent = Math.max(0, Math.min(100, (altitude / 420) * 100));
      document.getElementById('altBar').style.height = percent + '%';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>

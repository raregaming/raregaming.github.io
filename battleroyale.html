<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Royale - 15 Guns, Gloo Wall & Large Houses</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Impact, sans-serif; touch-action: manipulation; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; color: #fff; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }

    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); }
    #crosshair::before { top: 3px; left: -8px; width: 24px; height: 2px; }
    #crosshair::after { top: -8px; left: 3px; width: 2px; height: 24px; }

    /* Top Settings Button */
    #settingsBtn {
      position: absolute; top: 20px; right: 20px; z-index: 60;
      width: 44px; height: 44px; background: rgba(15, 18, 26, 0.85);
      border: 2px solid #f39c12; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 20px;
      cursor: pointer; box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
      pointer-events: auto;
    }

    /* Settings Modal */
    #settingsModal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      display: none; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(8px);
    }
    .settings-card {
      background: #14171f; width: 380px; max-width: 90vw;
      border: 2px solid #f39c12; border-radius: 12px; padding: 22px;
      box-shadow: 0 0 35px rgba(243, 156, 18, 0.3); text-align: center;
    }
    .settings-title { font-size: 20px; font-weight: 900; color: #f1c40f; margin-bottom: 18px; text-transform: uppercase; }
    .exit-btn {
      width: 100%; padding: 12px; background: linear-gradient(180deg, #ff4757, #c0392b);
      border: 2px solid #fff; border-radius: 6px; color: #fff; font-size: 15px;
      font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 10px;
    }
    .resume-btn { width: 100%; padding: 10px; background: #2f3542; border: none; border-radius: 6px; color: #aaa; font-weight: bold; cursor: pointer; }

    /* Flight HUD */
    #flightHud {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 50;
    }
    .flight-status {
      background: rgba(0, 0, 0, 0.75); border: 1px solid #f39c12; padding: 6px 20px;
      border-radius: 20px; font-size: 14px; font-weight: bold; color: #f1c40f;
    }
    .eject-btn {
      background: linear-gradient(180deg, #ff4757, #e84118); border: 2px solid #fff;
      color: #fff; font-size: 20px; font-weight: 900; font-style: italic;
      padding: 10px 45px; border-radius: 8px; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 25px rgba(255, 71, 87, 0.7);
    }

    /* Player Battle HUD */
    #gameHud {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 18, 26, 0.85); border-left: 4px solid #2ed573;
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold;
    }

    .alt-gauge {
      position: absolute; right: 25px; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.6); border: 1px solid #555; width: 16px; height: 180px;
      border-radius: 8px; display: none; overflow: hidden; z-index: 30;
    }
    #altBar { width: 100%; height: 100%; background: linear-gradient(180deg, #3498db, #2ecc71); }

    /* Touch Controls */
    #touchControls { position: absolute; inset: 0; pointer-events: none; z-index: 40; display: none; }
    #touchLookArea { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; }

    #joystickContainer {
      position: absolute; bottom: 35px; left: 35px; width: 130px; height: 130px;
      background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; pointer-events: auto; backdrop-filter: blur(4px);
    }
    #joystickKnob {
      position: absolute; top: 50%; left: 50%; width: 54px; height: 54px;
      background: radial-gradient(circle, #f39c12, #e67e22); border: 2px solid #fff;
      border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    }

    /* Tactical Action Buttons */
    .btn-action {
      position: absolute; pointer-events: auto; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .btn-action:active { transform: scale(0.92); filter: brightness(1.2); }

    #btnFire { bottom: 50px; right: 35px; width: 80px; height: 80px; background: radial-gradient(circle, #ff4757, #c0392b); font-size: 15px; border-color: #ff6b81; }
    #btnJump { bottom: 145px; right: 35px; width: 56px; height: 56px; background: radial-gradient(circle, #2ed573, #26af5f); font-size: 11px; }
    #btnGloo { bottom: 50px; right: 130px; width: 60px; height: 60px; background: radial-gradient(circle, #00d2d3, #0984e3); font-size: 11px; }
    #btnGrenade { bottom: 125px; right: 110px; width: 56px; height: 56px; background: radial-gradient(circle, #e67e22, #d35400); font-size: 10px; }

    #endScreen {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #endTitle { font-size: 55px; font-weight: 900; font-style: italic; margin-bottom: 20px; }
  </style>
</head>
<body>

  <script>
    const sessionUid = localStorage.getItem('game_uid');
    const sessionUser = localStorage.getItem('game_username');
    if (!sessionUid || !sessionUser) {
      window.location.href = 'login.html';
    }
  </script>

  <div id="settingsBtn" onclick="toggleSettings(true)">⚙️</div>

  <div id="settingsModal">
    <div class="settings-card">
      <div class="settings-title">Game Settings</div>
      <button class="exit-btn" onclick="exitToLobby()">🚪 Exit to Lobby</button>
      <button class="resume-btn" onclick="toggleSettings(false)">Resume Game</button>
    </div>
  </div>

  <div id="endScreen">
    <div id="endTitle">BOOYAH!</div>
    <button class="exit-btn" style="width: 200px;" onclick="exitToLobby()">Back to Lobby</button>
  </div>

  <div id="crosshair"></div>

  <div id="flightHud">
    <div class="flight-status">✈️ AIRBORNE: OVER BERMUDA VILLAGE</div>
    <button class="eject-btn" id="ejectBtn" onclick="ejectPlayer()">EJECT / JUMP</button>
  </div>

  <div class="alt-gauge" id="altGauge">
    <div id="altBar"></div>
  </div>

  <div id="gameHud">
    <div class="hud-card">
      <div>Player: <span style="color:#f1c40f;" id="hudPlayerName">PLAYER</span></div>
      <div>HP: <span id="hpVal" style="color:#2ed573;">100</span> / 100</div>
      <div>Weapon: <span id="weaponVal" style="color:#ffa502;">USP Pistol</span> (<span id="ammoVal">∞</span>)</div>
      <div>Gloo Walls: <span id="glooCount" style="color:#00d2d3;">3</span> | Nades: <span id="nadeCount" style="color:#e67e22;">2</span></div>
      <div>Alive: <span id="aliveVal" style="color:#e74c3c;">6</span></div>
    </div>
  </div>

  <div id="touchControls">
    <div id="touchLookArea"></div>
    <div id="joystickContainer">
      <div id="joystickKnob"></div>
    </div>
    <div class="btn-action" id="btnFire">FIRE</div>
    <div class="btn-action" id="btnJump">JUMP</div>
    <div class="btn-action" id="btnGloo">GLOO</div>
    <div class="btn-action" id="btnGrenade">NADE</div>
  </div>

  <script>
    document.getElementById('hudPlayerName').innerText = sessionUser;

    // -------------------------------------------------------------
    // 1. 15 COMPLETE GUNS & WEAPONS DATABASE
    // -------------------------------------------------------------
    const GUNS_DATABASE = {
      // Pistols
      USP: { name: "USP", dmg: 18, delay: 350, speed: 180, ammo: 45, color: 0x95a5a6 },
      DESERT_EAGLE: { name: "Desert Eagle", dmg: 54, delay: 550, speed: 210, ammo: 21, color: 0xf1c40f },
      // SMGs
      MP40: { name: "MP40", dmg: 22, delay: 110, speed: 200, ammo: 120, color: 0x3498db },
      VECTOR: { name: "Vector", dmg: 19, delay: 90, speed: 200, ammo: 150, color: 0x9b59b6 },
      UMP: { name: "UMP", dmg: 26, delay: 140, speed: 190, ammo: 90, color: 0x1abc9c },
      // Assault Rifles (AR)
      AK47: { name: "AK-47", dmg: 38, delay: 160, speed: 220, ammo: 120, color: 0xd35400 },
      M4A1: { name: "M4A1", dmg: 30, delay: 140, speed: 230, ammo: 120, color: 0x34495e },
      SCAR: { name: "SCAR-L", dmg: 32, delay: 145, speed: 225, ammo: 120, color: 0xe67e22 },
      GROZA: { name: "GROZA", dmg: 40, delay: 130, speed: 240, ammo: 90, color: 0x27ae60 },
      AUG: { name: "AUG", dmg: 34, delay: 150, speed: 230, ammo: 90, color: 0x7f8c8d },
      // Shotguns
      M1014: { name: "M1014 Shotgun", dmg: 14, delay: 750, speed: 170, ammo: 30, count: 6, color: 0xc0392b },
      M1887: { name: "M1887 (Double)", dmg: 22, delay: 600, speed: 180, ammo: 20, count: 7, color: 0x8e44ad },
      // Snipers
      AWM: { name: "AWM Sniper", dmg: 150, delay: 1400, speed: 320, ammo: 15, color: 0x2ecc71 },
      KAR98K: { name: "Kar98k", dmg: 95, delay: 1200, speed: 290, ammo: 25, color: 0xbdc3c7 },
      // LMG
      M249: { name: "M249 Heavy", dmg: 28, delay: 115, speed: 210, ammo: 200, color: 0x16a085 }
    };

    let currentGun = GUNS_DATABASE.USP;
    let glooWallsLeft = 3;
    let grenadesLeft = 2;
    let lastShotTime = 0;

    // -------------------------------------------------------------
    // 2. THREE.JS 3D SCENE & ENVIRONMENT
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x70a1ff);
    scene.fog = new THREE.FogExp2(0x70a1ff, 0.0022);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x555555, 0.85);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffae6, 1.2);
    sunLight.position.set(300, 600, 200);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Ground Map
    const MAP_SIZE = 1800;
    const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x558b2f });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const woodMat = new THREE.MeshLambertMaterial({ color: 0x5d4037 });
    const plankMat = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
    const roofMat = new THREE.MeshLambertMaterial({ color: 0x3e2723 });
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x4e342e });

    // -------------------------------------------------------------
    // 3. HOLLOW WALK-IN VILLAGE HOUSES & LOOT SPAWNS
    // -------------------------------------------------------------
    const lootItems = [];

    function spawnLootCrate(x, z, gunKey) {
      const gInfo = GUNS_DATABASE[gunKey];
      const crateGroup = new THREE.Group();
      
      const box = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 2), new THREE.MeshStandardMaterial({ color: gInfo.color, metalness: 0.5 }));
      box.position.y = 0.4;
      crateGroup.add(box);

      // 3D Floating Gun Model over crate
      const gunModel = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.8), new THREE.MeshBasicMaterial({ color: 0x111 }));
      gunModel.position.y = 1.6;
      crateGroup.add(gunModel);

      crateGroup.position.set(x, 0, z);
      scene.add(crateGroup);

      lootItems.push({ mesh: crateGroup, gunKey: gunKey, taken: false });
    }

    // Function: Create Large Hollow Walk-in House
    function createLargeHouse(x, z) {
      const house = new THREE.Group();
      const W = 28, H = 14, D = 26; // Big Mansion Size

      // Wooden Floor
      const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 0.6, D), floorMat);
      floor.position.y = 0.3;
      house.add(floor);

      // Back Wall
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(W, H, 1.2), plankMat);
      backWall.position.set(0, H / 2, -D / 2);
      house.add(backWall);

      // Left Wall
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, H, D), plankMat);
      leftWall.position.set(-W / 2, H / 2, 0);
      house.add(leftWall);

      // Right Wall
      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1.2, H, D), plankMat);
      rightWall.position.set(W / 2, H / 2, 0);
      house.add(rightWall);

      // Front Wall with Walk-In Door Opening (Left & Right Sections)
      const frontLeft = new THREE.Mesh(new THREE.BoxGeometry((W / 2) - 3.5, H, 1.2), plankMat);
      frontLeft.position.set(-((W / 4) + 1.75), H / 2, D / 2);
      house.add(frontLeft);

      const frontRight = new THREE.Mesh(new THREE.BoxGeometry((W / 2) - 3.5, H, 1.2), plankMat);
      frontRight.position.set(((W / 4) + 1.75), H / 2, D / 2);
      house.add(frontRight);

      const doorHeader = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 1.2), plankMat);
      doorHeader.position.set(0, H - 2, D / 2);
      house.add(doorHeader);

      // Roof
      const roof = new THREE.Mesh(new THREE.BoxGeometry(W + 3, 2, D + 3), roofMat);
      roof.position.y = H + 1;
      house.add(roof);

      house.position.set(x, 0, z);
      scene.add(house);

      // Spawn Gun inside house
      const gunKeys = Object.keys(GUNS_DATABASE);
      const randomGun = gunKeys[Math.floor(Math.random() * gunKeys.length)];
      spawnLootCrate(x, z, randomGun);
    }

    // Spawn 16 Walk-in Houses & Ground Loots
    for (let i = 0; i < 16; i++) {
      const hx = (Math.random() - 0.5) * 1100;
      const hz = (Math.random() - 0.5) * 1100;
      createLargeHouse(hx, hz);
    }

    // -------------------------------------------------------------
    // 4. PLAYER CHARACTER, PLANE & GLOO WALLS
    // -------------------------------------------------------------
    const planeGroup = new THREE.Group();
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x37474f, metalness: 0.5 });
    const pBody = new THREE.Mesh(new THREE.BoxGeometry(12, 10, 60), planeMat);
    planeGroup.add(pBody);
    const pWings = new THREE.Mesh(new THREE.BoxGeometry(80, 1.5, 12), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
    pWings.position.set(0, 2, -5);
    planeGroup.add(pWings);
    planeGroup.position.set(0, 380, -900);
    scene.add(planeGroup);

    // Player Model
    const playerGroup = new THREE.Group();
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc80 });
    const shirtMat = new THREE.MeshLambertMaterial({ color: 0x00bcd4 });
    const pantMat = new THREE.MeshLambertMaterial({ color: 0x1a237e });
    const gunMat = new THREE.MeshLambertMaterial({ color: 0x222 });

    const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), skinMat);
    head.position.y = 3.6;
    playerGroup.add(head);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.0, 1.0), shirtMat);
    torso.position.y = 2.0;
    playerGroup.add(torso);

    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.0, 0.6), shirtMat);
    armL.position.set(-1.1, 2.0, 0);
    playerGroup.add(armL);

    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.0, 0.6), shirtMat);
    armR.position.set(1.1, 2.0, 0);
    armR.rotation.x = -0.4;
    playerGroup.add(armR);

    const playerRifleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 2.2), gunMat);
    playerRifleMesh.position.set(1.1, 1.8, 0.8);
    playerRifleMesh.rotation.x = -0.4;
    playerGroup.add(playerRifleMesh);

    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.0, 0.7), pantMat);
    legL.position.set(-0.45, 0.0, 0);
    playerGroup.add(legL);

    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.0, 0.7), pantMat);
    legR.position.set(0.45, 0.0, 0);
    playerGroup.add(legR);

    const chuteGroup = new THREE.Group();
    const canopy = new THREE.Mesh(
      new THREE.SphereGeometry(6, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xf39c12, side: THREE.DoubleSide })
    );
    canopy.position.y = 10;
    chuteGroup.add(canopy);
    chuteGroup.visible = false;
    playerGroup.add(chuteGroup);

    playerGroup.visible = false;
    scene.add(playerGroup);

    // Gloo Walls & Grenades Database
    const activeGlooWalls = [];
    const activeGrenades = [];

    function deployGlooWall() {
      if (glooWallsLeft <= 0 || gameState !== 'GROUND') return;
      glooWallsLeft--;
      document.getElementById('glooCount').innerText = glooWallsLeft;

      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const spawnPos = playerPos.clone().add(forward.multiplyScalar(6));

      const glooGeo = new THREE.BoxGeometry(10, 6, 1.2);
      const glooMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3, transparent: true, opacity: 0.85, roughness: 0.1 });
      const glooMesh = new THREE.Mesh(glooGeo, glooMat);
      glooMesh.position.set(spawnPos.x, 3, spawnPos.z);
      glooMesh.rotation.y = yaw;
      scene.add(glooMesh);

      activeGlooWalls.push({ mesh: glooMesh, hp: 400 });
    }

    function throwGrenade() {
      if (grenadesLeft <= 0 || gameState !== 'GROUND') return;
      grenadesLeft--;
      document.getElementById('nadeCount').innerText = grenadesLeft;

      const forward = new THREE.Vector3(-Math.sin(yaw), 0.4, -Math.cos(yaw)).normalize();
      const nadeMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xe67e22 }));
      nadeMesh.position.copy(playerPos.clone().add(new THREE.Vector3(0, 3, 0)));
      scene.add(nadeMesh);

      activeGrenades.push({
        mesh: nadeMesh,
        velocity: forward.multiplyScalar(55),
        timer: 80
      });
    }

    // -------------------------------------------------------------
    // 5. ENEMY BOTS AI
    // -------------------------------------------------------------
    const bots = [];
    const botMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });

    function spawnBot(x, z) {
      const bGroup = new THREE.Group();
      const bHead = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), skinMat);
      bHead.position.y = 3.6;
      bGroup.add(bHead);

      const bTorso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.0, 1.0), botMat);
      bTorso.position.y = 2.0;
      bGroup.add(bTorso);

      const bArmR = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.0, 0.6), botMat);
      bArmR.position.set(1.1, 2.0, 0);
      bArmR.rotation.x = -0.4;
      bGroup.add(bArmR);

      const bGun = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 2.0), gunMat);
      bGun.position.set(1.1, 1.8, 0.8);
      bGun.rotation.x = -0.4;
      bGroup.add(bGun);

      const bLegL = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.0, 0.7), pantMat);
      bLegL.position.set(-0.45, 0.0, 0);
      bGroup.add(bLegL);

      const bLegR = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.0, 0.7), pantMat);
      bLegR.position.set(0.45, 0.0, 0);
      bGroup.add(bLegR);

      bGroup.position.set(x, 1.0, z);
      scene.add(bGroup);

      bots.push({ mesh: bGroup, hp: 100, lastShot: 0, alive: true });
    }

    for (let i = 0; i < 5; i++) spawnBot((Math.random() - 0.5) * 600, (Math.random() - 0.5) * 600);

    // -------------------------------------------------------------
    // 6. BULLETS & COMBAT
    // -------------------------------------------------------------
    const bullets = [];

    function shootBullet(origin, dir, isPlayer, gunConfig) {
      const bMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 6, 6),
        new THREE.MeshBasicMaterial({ color: isPlayer ? 0xf1c40f : 0xff4757 })
      );
      bMesh.position.copy(origin);
      scene.add(bMesh);

      bullets.push({
        mesh: bMesh,
        dir: dir.clone().normalize(),
        isPlayer: isPlayer,
        dmg: gunConfig.dmg,
        speed: gunConfig.speed,
        life: 75
      });
    }

    function playerShoot() {
      if (gameState !== 'GROUND' || playerHp <= 0) return;
      const now = Date.now();
      if (now - lastShotTime < currentGun.delay) return;
      if (currentGun.ammo <= 0) return;

      lastShotTime = now;
      if (currentGun.ammo !== Infinity) currentGun.ammo--;
      document.getElementById('ammoVal').innerText = currentGun.ammo;

      const origin = playerPos.clone().add(new THREE.Vector3(0, 3.2, 0));
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));

      if (currentGun.count) {
        // Shotgun Multiple Pellets
        for (let i = 0; i < currentGun.count; i++) {
          const spreadDir = forward.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.15, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.15));
          shootBullet(origin, spreadDir, true, currentGun);
        }
      } else {
        shootBullet(origin, forward, true, currentGun);
      }
    }

    // -------------------------------------------------------------
    // 7. CONTROLS (JOYSTICK, BUTTONS & MOUSE)
    // -------------------------------------------------------------
    let gameState = 'PLANE';
    let playerPos = new THREE.Vector3(0, 380, -900);
    let playerVelocity = new THREE.Vector3(0, 0, 0);
    let playerHp = 100;
    let aliveCount = 6;

    function ejectPlayer() {
      if (gameState !== 'PLANE') return;
      gameState = 'FREEFALL';
      document.getElementById('flightHud').style.display = 'none';
      document.getElementById('altGauge').style.display = 'block';

      playerPos.copy(planeGroup.position);
      playerGroup.position.copy(playerPos);
      playerGroup.visible = true;
      playerVelocity.set(0, -20, 50);
    }

    let joystickVector = { x: 0, y: 0 };
    let yaw = 0, pitch = 0.2;
    let isJumping = false, jumpVelocity = 0;

    const joyContainer = document.getElementById('joystickContainer');
    const joyKnob = document.getElementById('joystickKnob');
    let joyTouchId = null;

    joyContainer.addEventListener('touchstart', (e) => {
      joyTouchId = e.changedTouches[0].identifier;
      updateJoystick(e.changedTouches[0]);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) updateJoystick(e.changedTouches[i]);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyTouchId = null;
          joystickVector = { x: 0, y: 0 };
          joyKnob.style.transform = `translate(-50%, -50%)`;
        }
      }
    });

    function updateJoystick(touch) {
      const rect = joyContainer.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      const maxDist = 45;
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joystickVector.x = dx / maxDist;
      joystickVector.y = -dy / maxDist;
    }

    const lookArea = document.getElementById('touchLookArea');
    let lastLookX = 0, lastLookY = 0, lookTouchId = null;

    lookArea.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      lookTouchId = touch.identifier;
      lastLookX = touch.clientX; lastLookY = touch.clientY;
    }, { passive: false });

    lookArea.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === lookTouchId) {
          yaw -= (touch.clientX - lastLookX) * 0.005;
          pitch -= (touch.clientY - lastLookY) * 0.003;
          pitch = Math.max(-0.1, Math.min(0.8, pitch));
          lastLookX = touch.clientX; lastLookY = touch.clientY;
        }
      }
    }, { passive: false });

    lookArea.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
      }
    });

    document.getElementById('btnJump').addEventListener('touchstart', () => {
      if (gameState === 'GROUND' && !isJumping) { isJumping = true; jumpVelocity = 14; }
    });
    document.getElementById('btnFire').addEventListener('touchstart', playerShoot);
    document.getElementById('btnGloo').addEventListener('touchstart', deployGlooWall);
    document.getElementById('btnGrenade').addEventListener('touchstart', throwGrenade);

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Escape') toggleSettings(document.getElementById('settingsModal').style.display !== 'flex');
      if (e.code === 'Space' && gameState === 'PLANE') ejectPlayer();
      if (e.code === 'KeyG') deployGlooWall();
      if (e.code === 'KeyF') throwGrenade();
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === document.body && gameState === 'GROUND') {
        yaw -= e.movementX * 0.003;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-0.1, Math.min(0.8, pitch));
      }
    });

    window.addEventListener('mousedown', (e) => {
      if (gameState === 'GROUND' && e.button === 0 && document.pointerLockElement === document.body) {
        playerShoot();
      }
    });

    window.addEventListener('click', () => {
      if (gameState === 'GROUND' && document.getElementById('settingsModal').style.display !== 'flex') {
        document.body.requestPointerLock();
      }
    });

    function toggleSettings(show) {
      document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
      if (show && document.pointerLockElement === document.body) document.exitPointerLock();
    }
    function exitToLobby() { window.location.href = 'index.html'; }

    // -------------------------------------------------------------
    // 8. MAIN GAME LOOP & CAMERA INTERIOR CHECK
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    let walkAnimTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (gameState === 'PLANE') {
        planeGroup.position.z += 90 * delta;
        camera.position.set(planeGroup.position.x, planeGroup.position.y + 15, planeGroup.position.z - 50);
        camera.lookAt(planeGroup.position.x, planeGroup.position.y, planeGroup.position.z + 80);
        if (planeGroup.position.z > 600) ejectPlayer();
      }

      else if (gameState === 'FREEFALL') {
        playerVelocity.y -= 30 * delta;
        playerVelocity.y = Math.max(-80, playerVelocity.y);
        playerPos.addScaledVector(playerVelocity, delta);
        playerGroup.position.copy(playerPos);

        camera.position.set(playerPos.x, playerPos.y + 10, playerPos.z - 25);
        camera.lookAt(playerPos.x, playerPos.y, playerPos.z + 15);

        if (playerPos.y <= 140) {
          gameState = 'PARACHUTE';
          chuteGroup.visible = true;
        }
        updateAltGauge(playerPos.y);
      }

      else if (gameState === 'PARACHUTE') {
        playerVelocity.y = -16;
        playerVelocity.z = 24;
        playerPos.addScaledVector(playerVelocity, delta);
        playerGroup.position.copy(playerPos);

        camera.position.set(playerPos.x, playerPos.y + 12, playerPos.z - 28);
        camera.lookAt(playerPos.x, playerPos.y + 2, playerPos.z + 10);

        if (playerPos.y <= 1.0) {
          playerPos.y = 1.0;
          playerGroup.position.y = 1.0;
          chuteGroup.visible = false;
          gameState = 'GROUND';

          document.getElementById('altGauge').style.display = 'none';
          document.getElementById('crosshair').style.display = 'block';
          document.getElementById('touchControls').style.display = 'block';
        }
        updateAltGauge(playerPos.y);
      }

      else if (gameState === 'GROUND') {
        const moveSpeed = 32 * delta;
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();
        let isMoving = false;

        if (joystickVector.y !== 0) { playerPos.add(forward.clone().multiplyScalar(joystickVector.y * moveSpeed)); isMoving = true; }
        if (joystickVector.x !== 0) { playerPos.add(right.clone().multiplyScalar(joystickVector.x * moveSpeed)); isMoving = true; }

        if (keys['KeyW']) { playerPos.add(forward.clone().multiplyScalar(moveSpeed)); isMoving = true; }
        if (keys['KeyS']) { playerPos.add(forward.clone().multiplyScalar(-moveSpeed)); isMoving = true; }
        if (keys['KeyA']) { playerPos.add(right.clone().multiplyScalar(-moveSpeed)); isMoving = true; }
        if (keys['KeyD']) { playerPos.add(right.clone().multiplyScalar(moveSpeed)); isMoving = true; }

        if (keys['Space'] && !isJumping) { isJumping = true; jumpVelocity = 14; }
        if (isJumping) {
          playerPos.y += jumpVelocity * delta;
          jumpVelocity -= 36 * delta;
          if (playerPos.y <= 1.0) { playerPos.y = 1.0; isJumping = false; }
        }

        playerGroup.position.copy(playerPos);
        playerGroup.rotation.y = yaw;

        if (isMoving) {
          walkAnimTime += delta * 12;
          armL.rotation.x = Math.sin(walkAnimTime) * 0.8;
          legL.rotation.x = -Math.sin(walkAnimTime) * 0.8;
          legR.rotation.x = Math.sin(walkAnimTime) * 0.8;
        } else {
          armL.rotation.x = 0; legL.rotation.x = 0; legR.rotation.x = 0;
        }

        // Smart Camera (Closer Distance for interior house vision)
        const camDist = 11;
        camera.position.x = playerPos.x + Math.sin(yaw) * camDist;
        camera.position.z = playerPos.z + Math.cos(yaw) * camDist;
        camera.position.y = playerPos.y + (4.5 + pitch * 6);
        camera.lookAt(playerPos.x, playerPos.y + 2.8, playerPos.z);

        // Loot Pickups Check
        lootItems.forEach(item => {
          if (!item.taken && playerPos.distanceTo(item.mesh.position) < 4.5) {
            item.taken = true;
            scene.remove(item.mesh);
            currentGun = GUNS_DATABASE[item.gunKey];
            document.getElementById('weaponVal').innerText = currentGun.name;
            document.getElementById('ammoVal').innerText = currentGun.ammo;
            playerRifleMesh.material.color.setHex(currentGun.color);
          }
        });

        // Bots AI
        const now = Date.now();
        bots.forEach(bot => {
          if (!bot.alive) return;
          const dist = bot.mesh.position.distanceTo(playerPos);
          bot.mesh.lookAt(playerPos.x, bot.mesh.position.y, playerPos.z);

          if (dist > 15 && dist < 120) {
            const dir = new THREE.Vector3().subVectors(playerPos, bot.mesh.position).normalize();
            bot.mesh.position.addScaledVector(dir, 14 * delta);
          }

          if (dist < 80 && now - bot.lastShot > 1800) {
            bot.lastShot = now;
            const bOrigin = bot.mesh.position.clone().add(new THREE.Vector3(0, 2.5, 0));
            const bDir = new THREE.Vector3().subVectors(playerPos, bot.mesh.position).normalize();
            shootBullet(bOrigin, bDir, false, { dmg: 14, speed: 180 });
          }
        });
      }

      // --- GRENADES PHYSICS & EXPLOSION ---
      for (let i = activeGrenades.length - 1; i >= 0; i--) {
        const nade = activeGrenades[i];
        nade.mesh.position.addScaledVector(nade.velocity, delta);
        nade.velocity.y -= 25 * delta;
        if (nade.mesh.position.y <= 0.5) { nade.mesh.position.y = 0.5; nade.velocity.multiplyScalar(0.4); }
        nade.timer--;

        if (nade.timer <= 0) {
          // Blast Effect & Splash Damage
          bots.forEach(b => {
            if (b.alive && b.mesh.position.distanceTo(nade.mesh.position) < 25) {
              b.hp -= 150; // Instant elimination
              if (b.hp <= 0) {
                b.alive = false; scene.remove(b.mesh); aliveCount--;
                document.getElementById('aliveVal').innerText = aliveCount;
              }
            }
          });
          scene.remove(nade.mesh);
          activeGrenades.splice(i, 1);
        }
      }

      // --- BULLETS COLLISION & GLOO WALL BLOCKING ---
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.mesh.position.addScaledVector(b.dir, b.speed * delta);
        b.life--;

        // Check Gloo Wall Block
        for (let g = 0; g < activeGlooWalls.length; g++) {
          if (b.mesh.position.distanceTo(activeGlooWalls[g].mesh.position) < 5) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            break;
          }
        }

        // Check Player Hit
        if (!b.isPlayer && gameState === 'GROUND' && playerHp > 0) {
          if (b.mesh.position.distanceTo(playerPos.clone().add(new THREE.Vector3(0, 2, 0))) < 2.2) {
            playerHp -= b.dmg;
            document.getElementById('hpVal').innerText = Math.max(0, playerHp);
            scene.remove(b.mesh);
            bullets.splice(i, 1);

            if (playerHp <= 0) {
              document.getElementById('endTitle').innerText = "GAME OVER";
              document.getElementById('endTitle').style.color = "#ff4757";
              document.getElementById('endScreen').style.display = "flex";
            }
            continue;
          }
        }

        // Check Bot Hit
        if (b.isPlayer) {
          for (let j = 0; j < bots.length; j++) {
            const bot = bots[j];
            if (bot.alive && b.mesh.position.distanceTo(bot.mesh.position.clone().add(new THREE.Vector3(0, 2, 0))) < 2.5) {
              bot.hp -= b.dmg;
              scene.remove(b.mesh);
              bullets.splice(i, 1);

              if (bot.hp <= 0) {
                bot.alive = false;
                scene.remove(bot.mesh);
                aliveCount--;
                document.getElementById('aliveVal').innerText = aliveCount;

                if (aliveCount <= 1) {
                  document.getElementById('endTitle').innerText = "BOOYAH!";
                  document.getElementById('endTitle').style.color = "#f1c40f";
                  document.getElementById('endScreen').style.display = "flex";
                }
              }
              break;
            }
          }
        }

        if (b.life <= 0) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    function updateAltGauge(altitude) {
      const percent = Math.max(0, Math.min(100, (altitude / 380) * 100));
      document.getElementById('altBar').style.height = percent + '%';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Registration | RG x RARE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background: #08080c;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    .wrapper {
      width: 100%;
      max-width: 650px;
      background: rgba(18, 20, 29, 0.95);
      border: 2px solid #a125ff;
      box-shadow: 0 0 30px rgba(161, 37, 255, 0.3);
      border-radius: 12px;
      padding: 25px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .header h2 {
      font-family: 'Orbitron', sans-serif;
      color: #00e6ff;
      font-size: 24px;
      letter-spacing: 2px;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      color: #ff4655;
      font-size: 13px;
      margin: 18px 0 10px 0;
      letter-spacing: 1px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-card {
      background: #0c0d14;
      border-left: 3px solid #00e6ff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    label {
      font-size: 11px;
      color: #8a93a0;
      font-weight: 700;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      background: #141622;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    input:focus {
      border-color: #ff4655;
      box-shadow: 0 0 8px rgba(255, 70, 85, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background: linear-gradient(135deg, #ff4655, #a125ff);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 70, 85, 0.4);
    }

    #successBox {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .whatsapp-btn {
      display: block;
      margin-top: 20px;
      padding: 15px;
      background: #25D366;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      text-decoration: none;
      border-radius: 6px;
    }

    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <h2>SQUAD REGISTRATION</h2>
    </div>

    <form id="tournamentForm">
      <div class="section-title">01. TEAM DETAILS</div>
      <input type="text" id="teamName" placeholder="TEAM NAME" required style="margin-bottom:10px;">
      <div class="grid-2">
        <input type="text" id="captainName" placeholder="CAPTAIN NAME" required>
        <input type="tel" id="whatsappNo" placeholder="WHATSAPP NO" required>
      </div>

      <div class="section-title">02. PLAYERS (NAME & UID)</div>
      
      <div class="player-card">
        <label>PLAYER 1 (CAPTAIN)</label>
        <div class="grid-2">
          <input type="text" placeholder="Name" required>
          <input type="text" placeholder="UID" required>
        </div>
      </div>

      <div class="player-card">
        <label>PLAYER 2</label>
        <div class="grid-2">
          <input type="text" placeholder="Name" required>
          <input type="text" placeholder="UID" required>
        </div>
      </div>

      <div class="player-card">
        <label>PLAYER 3</label>
        <div class="grid-2">
          <input type="text" placeholder="Name" required>
          <input type="text" placeholder="UID" required>
        </div>
      </div>

      <div class="player-card">
        <label>PLAYER 4</label>
        <div class="grid-2">
          <input type="text" placeholder="Name" required>
          <input type="text" placeholder="UID" required>
        </div>
      </div>

      <div class="player-card" style="border-left-color: #ff4655;">
        <label style="color: #ff4655;">UPLOAD TEAM LOGO</label>
        <input type="file" accept="image/*" style="background:transparent; border:none; padding:5px 0;">
      </div>

      <button type="submit" class="submit-btn">SUBMIT REGISTRATION</button>
    </form>

    <div id="successBox">
      <h2 style="color:#00e6ff; font-family:'Orbitron';">REGISTRATION DONE!</h2>
      <p style="margin-top:10px; color:#ccc;">नीचे बटन पर क्लिक करके Official WhatsApp Community ज्वाइन करें!</p>
      <a href="https://chat.whatsapp.com/HNJr2Jidm1b4YGHyhCRKyr" target="_blank" class="whatsapp-btn">💬 JOIN WHATSAPP COMMUNITY</a>
    </div>
  </div>

  <script>
    document.getElementById("tournamentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("tournamentForm").style.display = "none";
      document.getElementById("successBox").style.display = "block";
    });
  </script>

</body>
  </html>
